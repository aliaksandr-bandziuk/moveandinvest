<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="What moving to Greece changes for an American">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">What moving to Greece changes for an American</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="208" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="start">Greek residence changes</text><text x="620" y="208" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">Greek residence does not touch</text><line x1="48" y1="228" x2="1152" y2="228" stroke="#dce0e7" stroke-width="1"/><text x="48" y="282" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Where income tax is primarily due</text><text x="620" y="282" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#7a2230" text-anchor="start">The annual US return on worldwide income</text><line x1="48" y1="344" x2="1152" y2="344" stroke="#dce0e7" stroke-width="1"/><text x="48" y="400" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Which social security system receives contributions</text><text x="620" y="400" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#7a2230" text-anchor="start">The certificate of coverage, form GR/USA 1</text><line x1="48" y1="462" x2="1152" y2="462" stroke="#dce0e7" stroke-width="1"/><text x="48" y="518" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Whether the Greek special tax regimes are available</text><text x="620" y="518" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#7a2230" text-anchor="start">The saving clause at art. XIV(1), 1950 treaty</text>
  <text x="48" y="668" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The left column is Greek law. The right column is American law, and Greek residence does not reach it.</text>
  <line x1="48" y1="692" x2="1152" y2="692" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="722" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 8 September 2026</text>
  <text x="1152" y="722" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>