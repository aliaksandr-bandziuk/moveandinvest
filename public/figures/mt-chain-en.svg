<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Ninety-one days from judgment to deletion">
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Ninety-one days from judgment to deletion</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">WHEN</text><text x="330" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">WHAT WAS DONE</text><line x1="48" y1="218" x2="1152" y2="218" stroke="#dce0e7" stroke-width="1"/><text x="48" y="272" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">29 April 2025</text><text x="330" y="272" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Case C-181/23, Commission v Malta</text><text x="330" y="300" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Court of Justice, Grand Chamber. Almost no page describing the scheme names it.</text><line x1="48" y1="350" x2="1152" y2="350" stroke="#dce0e7" stroke-width="1"/><text x="48" y="404" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">24 July 2025</text><text x="330" y="404" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Act XXI of 2025</text><text x="330" y="432" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Gazette 21,474. Substituted article 10(9) of Cap. 188, the enabling provision.</text><line x1="48" y1="482" x2="1152" y2="482" stroke="#dce0e7" stroke-width="1"/><text x="48" y="536" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">29 July 2025</text><text x="330" y="536" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">L.N. 159 of 2025 — Part IV deleted</text><text x="330" y="564" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Gazette 21,478. Retitled S.L. 188.06; removed Part IV and two Schedules.</text><line x1="48" y1="614" x2="1152" y2="614" stroke="#dce0e7" stroke-width="1"/><text x="48" y="668" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#7a2230" text-anchor="start">Still, in 2026</text><text x="330" y="668" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#7a2230" text-anchor="start">The agency's own pages show the old figures</text><text x="330" y="696" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">600,000 € and 750,000 € under February 2026 timestamps, seen 6 September 2026.</text>
  <text x="48" y="808" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The last row is not an instrument. It is what a government web page still displayed thirteen months later.</text>
  <line x1="48" y1="832" x2="1152" y2="832" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="862" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 7 September 2026</text>
  <text x="1152" y="862" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>