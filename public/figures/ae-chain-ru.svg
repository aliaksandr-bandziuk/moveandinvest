'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="end">да</text><line x1="48" y1="536" x2="1152" y2="536" stroke="#dce0e7" stroke-width="1"/><rect x="48" y="562" width="4" height="56" fill="#b9c0cc"/><text x="76" y="588" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#5a6478" text-anchor="start">Дубай, изменения 2026 года</text><text x="76" y="614" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Отмена порога 750 000 и правила 50% предоплаты</text><text x="1152" y="588" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="end">нигде не найден</text>
