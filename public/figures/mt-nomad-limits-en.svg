<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="What the nomad permit allows, and what it forbids">
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">What the nomad permit allows, and what it forbids</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="100" y="212" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0e1420" text-anchor="start">Allowed</text><text x="650" y="212" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#7a2230" text-anchor="start">Not permitted</text><line x1="48" y1="236" x2="1152" y2="236" stroke="#dce0e7" stroke-width="1"/><text x="100" y="292" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="100" dy="0">Employment by a</tspan><tspan x="100" dy="28">foreign employer</tspan></text><text x="650" y="292" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="650" dy="0">Any economic activity with</tspan><tspan x="650" dy="28">employers or companies</tspan><tspan x="650" dy="28">registered in Malta</tspan></text><line x1="48" y1="354" x2="1152" y2="354" stroke="#dce0e7" stroke-width="1"/><text x="100" y="398" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="100" dy="0">Self-employment through a</tspan><tspan x="100" dy="28">company registered abroad</tspan></text><text x="650" y="398" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="650" dy="0">Adding dependants after</tspan><tspan x="650" dy="28">approval, newborns aside</tspan></text><line x1="48" y1="460" x2="1152" y2="460" stroke="#dce0e7" stroke-width="1"/><text x="100" y="504" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="100" dy="0">Freelancing for clients</tspan><tspan x="100" dy="28">established abroad</tspan></text><text x="650" y="504" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="650" dy="0">Any route onward to</tspan><tspan x="650" dy="28">permanent residence</tspan></text><line x1="48" y1="566" x2="1152" y2="566" stroke="#dce0e7" stroke-width="1"/><text x="100" y="610" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="100" dy="0">A spouse and</tspan><tspan x="100" dy="28">dependent children</tspan></text><text x="650" y="610" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="650" dy="0">Any route onward</tspan><tspan x="650" dy="28">to citizenship</tspan></text>
  <text x="48" y="708" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The prohibition on Maltese employers and companies disqualifies rather than inconveniences.</text>
  <line x1="48" y1="732" x2="1152" y2="732" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="762" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 5 September 2026</text>
  <text x="1152" y="762" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>