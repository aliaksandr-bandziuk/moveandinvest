<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" role="img" aria-label="Два маршрута, которые остались">
  <rect width="1200" height="980" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ГАЙДЫ И ИССЛЕДОВАНИЯ</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Два маршрута, которые остались</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="400" y="208" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="start">Натурализация за заслуги</text><text x="780" y="208" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="start">Обычная натурализация</text><line x1="48" y1="228" x2="1152" y2="228" stroke="#dce0e7" stroke-width="1"/><text x="48" y="282" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">Требуется проживание</text><text x="400" y="282" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Не менее восьми месяцев</text><text x="780" y="282" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">12 месяцев + 4 года из 6</text><line x1="48" y1="344" x2="1152" y2="344" stroke="#dce0e7" stroke-width="1"/><text x="48" y="400" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">Заявление должно показать</text><text x="400" y="400" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Жильё и язык</text><text x="780" y="400" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Обычные условия главы 188</text><line x1="48" y1="462" x2="1152" y2="462" stroke="#dce0e7" stroke-width="1"/><text x="48" y="518" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">Решается по</text><text x="400" y="518" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Шесть названных оснований</text><text x="780" y="518" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Длительности проживания</text><line x1="48" y1="580" x2="1152" y2="580" stroke="#dce0e7" stroke-width="1"/><text x="48" y="636" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">Надзор</text><text x="400" y="636" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Отдельный Регулятор</text><text x="780" y="636" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Обычная процедура</text><line x1="48" y1="698" x2="1152" y2="698" stroke="#dce0e7" stroke-width="1"/><text x="48" y="754" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">Сбор в самом акте</text><text x="400" y="754" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">Не опубликован</text><text x="780" y="754" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Вне этого регламента</text>
  <text x="48" y="888" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Гражданства за инвестиции среди них нет: соответствующая часть регламента удалена.</text>
  <line x1="48" y1="912" x2="1152" y2="912" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="942" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Все цифры сверены с первоисточником 9 сентября 2026 года</text>
  <text x="1152" y="942" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>