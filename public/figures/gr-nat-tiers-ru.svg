<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="Три срока по одному закону">
  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ГАЙДЫ И ИССЛЕДОВАНИЯ</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Три срока по одному закону</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="250" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">Три непрерывных года</text><text x="48" y="276" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Граждане ЕС; супруг грека С РЕБЁНКОМ; опека над ребёнком-греком; апатриды</text><rect x="430" y="296" width="143.0769230769231" height="40" fill="#b9c0cc"/><text x="589.0769230769231" y="324" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" font-weight="600" fill="#0e1420" text-anchor="start">3</text><line x1="48" y1="362" x2="1152" y2="362" stroke="#dce0e7" stroke-width="1"/><text x="48" y="400" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#7a2230" text-anchor="start">Семь непрерывных лет</text><text x="48" y="426" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Все прочие с титулом из закрытого перечня ст. 5(1)(ε) — инвесторский там, подпункт αθ</text><rect x="430" y="446" width="333.8461538461538" height="40" fill="#7a2230"/><text x="779.8461538461538" y="474" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" font-weight="600" fill="#7a2230" text-anchor="start">7</text><line x1="48" y1="512" x2="1152" y2="512" stroke="#dce0e7" stroke-width="1"/><text x="48" y="550" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">Двенадцать непрерывных лет</text><text x="48" y="576" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Любой другой действующий титул, кроме временных — ст. 5(3)</text><rect x="430" y="596" width="572.3076923076924" height="40" fill="#b9c0cc"/><text x="1018.3076923076924" y="624" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="25" font-weight="600" fill="#0e1420" text-anchor="start">12</text><line x1="430" y1="690" x2="1050" y2="690" stroke="#b9c0cc" stroke-width="1"/><line x1="430" y1="690" x2="430" y2="697" stroke="#b9c0cc" stroke-width="1"/><text x="430" y="716" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">0</text><line x1="525.3846153846154" y1="690" x2="525.3846153846154" y2="697" stroke="#b9c0cc" stroke-width="1"/><text x="525.3846153846154" y="716" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">2</text><line x1="620.7692307692307" y1="690" x2="620.7692307692307" y2="697" stroke="#b9c0cc" stroke-width="1"/><text x="620.7692307692307" y="716" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">4</text><line x1="716.1538461538462" y1="690" x2="716.1538461538462" y2="697" stroke="#b9c0cc" stroke-width="1"/><text x="716.1538461538462" y="716" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">6</text><line x1="811.5384615384615" y1="690" x2="811.5384615384615" y2="697" stroke="#b9c0cc" stroke-width="1"/><text x="811.5384615384615" y="716" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">8</text><line x1="906.9230769230769" y1="690" x2="906.9230769230769" y2="697" stroke="#b9c0cc" stroke-width="1"/><text x="906.9230769230769" y="716" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">10</text><line x1="1002.3076923076924" y1="690" x2="1002.3076923076924" y2="697" stroke="#b9c0cc" stroke-width="1"/><text x="1002.3076923076924" y="716" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">12</text>
  <text x="48" y="768" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Все три — «συνεχή», непрерывные. Окна для сложения разорванных периодов Кодекс не даёт.</text>
  <line x1="48" y1="792" x2="1152" y2="792" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="822" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Все цифры сверены с первоисточником 9 сентября 2026 года</text>
  <text x="1152" y="822" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>