<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-label="Что требует статья 6(1) и что в ней новое">
  <rect width="1200" height="960" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ГАЙДЫ И ИССЛЕДОВАНИЯ</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Что требует статья 6(1) и что в ней новое</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">СТАТЬЯ</text><text x="210" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ЧТО ТРЕБУЕТ</text><text x="950" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ИЗМЕНЕНИЯ</text><line x1="48" y1="218" x2="1152" y2="218" stroke="#dce0e7" stroke-width="1"/><text x="48" y="272" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">6(1)(a)</text><text x="210" y="272" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="210" dy="0">Совершеннолетие по португальскому праву</tspan><tspan x="210" dy="29">или по праву страны происхождения</tspan></text><text x="950" y="272" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#5a6478" text-anchor="start">Без изменений</text><line x1="48" y1="334" x2="1152" y2="334" stroke="#dce0e7" stroke-width="1"/><text x="48" y="390" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#0e1420" text-anchor="start">6(1)(b)</text><text x="210" y="390" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start"><tspan x="210" dy="0">Семь лет законного проживания для граждан</tspan><tspan x="210" dy="29">ЕС и CPLP, десять для всех остальных</tspan></text><text x="950" y="390" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">Удвоено</text><line x1="48" y1="452" x2="1152" y2="452" stroke="#dce0e7" stroke-width="1"/><text x="48" y="508" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#0e1420" text-anchor="start">6(1)(c)</text><text x="210" y="508" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start"><tspan x="210" dy="0">Достаточное знание языка, а также</tspan><tspan x="210" dy="29">культуры, истории и символов</tspan></text><text x="950" y="508" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">Расширено</text><line x1="48" y1="570" x2="1152" y2="570" stroke="#dce0e7" stroke-width="1"/><text x="48" y="626" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#0e1420" text-anchor="start">6(1)(d)</text><text x="210" y="626" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start"><tspan x="210" dy="0">Достаточное знание прав и обязанностей</tspan><tspan x="210" dy="29">гражданства и устройства государства</tspan></text><text x="950" y="626" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">Новое</text><line x1="48" y1="688" x2="1152" y2="688" stroke="#dce0e7" stroke-width="1"/><text x="48" y="744" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#0e1420" text-anchor="start">6(1)(e)</text><text x="210" y="744" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start"><tspan x="210" dy="0">Торжественная декларация о приверженности</tspan><tspan x="210" dy="29">принципам правового государства</tspan></text><text x="950" y="744" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">Новое</text>
  <text x="48" y="868" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Статья 6(1) в редакции Lei Orgânica 1/2026. Уровня по общеевропейской шкале закон не называет: A2 — практика.</text>
  <line x1="48" y1="892" x2="1152" y2="892" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="922" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Все цифры сверены с первоисточником 7 сентября 2026 года</text>
  <text x="1152" y="922" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>