<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="What Malta measures, and how often">
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">What Malta measures, and how often</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="208" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">WHAT</text><text x="470" y="208" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">HOW OFTEN</text><text x="810" y="208" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">NEWEST PUBLISHED</text><line x1="48" y1="228" x2="1152" y2="228" stroke="#dce0e7" stroke-width="1"/><text x="48" y="282" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Consumer prices (HICP)</text><text x="470" y="282" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Every month</text><text x="810" y="282" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">March 2026 — 2.3% a year</text><line x1="48" y1="344" x2="1152" y2="344" stroke="#dce0e7" stroke-width="1"/><text x="48" y="400" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Registered private leases</text><text x="470" y="400" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Periodic reports since Jan 2020</text><text x="810" y="400" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Second half of 2023</text><line x1="48" y1="462" x2="1152" y2="462" stroke="#dce0e7" stroke-width="1"/><text x="48" y="518" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#7a2230" text-anchor="start">What a household spends</text><text x="470" y="518" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#7a2230" text-anchor="start">Once a decade, in practice</text><text x="810" y="518" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">2015–2016</text>
  <text x="48" y="628" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Prices are counted monthly. Household spending was last counted in 2015–2016; the new count is still being processed.</text>
  <line x1="48" y1="652" x2="1152" y2="652" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="682" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 7 September 2026</text>
  <text x="1152" y="682" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>