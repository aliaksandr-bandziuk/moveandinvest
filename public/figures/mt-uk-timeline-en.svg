<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" role="img" aria-label="Two instruments over one British person in Malta">
  <rect width="1200" height="830" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Two instruments over one British person in Malta</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="250" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#5a6478" text-anchor="start">Convention signed</text><text x="360" y="250" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="600" fill="#0e1420" text-anchor="start">12 May 1994</text><text x="360" y="278" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">SI 1995 No. 763. HMRC records one phrase omitted from the published text</text><line x1="48" y1="308" x2="1152" y2="308" stroke="#dce0e7" stroke-width="1"/><text x="48" y="346" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#5a6478" text-anchor="start">In force</text><text x="360" y="346" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="600" fill="#0e1420" text-anchor="start">27 March 1995</text><text x="360" y="374" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Synthesised text with the MLI is published on gov.uk</text><line x1="48" y1="404" x2="1152" y2="404" stroke="#dce0e7" stroke-width="1"/><text x="48" y="442" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#5a6478" text-anchor="start">Effect</text><text x="360" y="442" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="600" fill="#0e1420" text-anchor="start">1 January 1996 in Malta</text><text x="360" y="470" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">1 April 1996 UK corporation tax, 6 April 1996 income and capital gains tax</text><line x1="48" y1="500" x2="1152" y2="500" stroke="#dce0e7" stroke-width="1"/><text x="48" y="538" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#5a6478" text-anchor="start">MLI effect</text><text x="360" y="538" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="600" fill="#0e1420" text-anchor="start">1 January 2020</text><text x="360" y="566" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">In force 1 October 2018 for the UK, 1 April 2019 for Malta</text><line x1="48" y1="596" x2="1152" y2="596" stroke="#dce0e7" stroke-width="1"/><text x="48" y="634" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#5a6478" text-anchor="start">Unchanged by the MLI</text><text x="360" y="634" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="600" fill="#7a2230" text-anchor="start">Articles 4, 18 and 23</text><text x="360" y="662" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">What it added is a principal purpose test, under MLI article 7</text>
  <text x="48" y="738" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The MLI reached this convention in 2020 and left articles 4, 18 and 23 alone.</text>
  <line x1="48" y1="762" x2="1152" y2="762" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="792" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 9 September 2026</text>
  <text x="1152" y="792" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>