<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Co osoba fizyczna faktycznie płaci w Emiratach">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">PORADNIKI I BADANIA</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Co osoba fizyczna faktycznie płaci w Emiratach</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">BRAK PRZEPISU NAKŁADAJĄCEGO PODATEK</text><text x="620" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">A TO TRZEBA ZAPŁACIĆ</text><line x1="48" y1="218" x2="1152" y2="218" stroke="#dce0e7" stroke-width="1"/><text x="48" y="262" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">Podatek dochodowy</text><text x="48" y="308" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">Podatek od zysków kapitałowych</text><text x="48" y="354" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">Podatek spadkowy</text><text x="48" y="400" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">Podatek od majątku</text><text x="48" y="458" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="48" dy="0">To nie zwolnienie, tylko brak przepisu:</tspan><tspan x="48" dy="25">zwolnienie znosi się nowelizacją,</tspan><tspan x="48" dy="25">brak trzeba wypełnić ustawą.</tspan></text><text x="620" y="262" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">VAT</text><text x="620" y="286" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Dekret federalny 8/2017, art. 3</text><text x="1152" y="262" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="end">5%</text><text x="620" y="340" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Opłata od przeniesienia, Dubaj</text><text x="620" y="364" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Uchwała 30/2013, załącznik, poz. 1</text><text x="1152" y="340" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="end">4%</text><text x="620" y="418" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Opłata mieszkaniowa gminy Dubaj</text><text x="620" y="442" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#7a2230" text-anchor="start">Nie udało się ustalić aktu</text><text x="1152" y="418" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="end">5%</text><text x="620" y="496" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Podatek od osób prawnych</text><text x="620" y="520" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Powyżej 375 000 dirhamów — uchwała 116/2022</text><text x="1152" y="496" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="end">9%</text>
  <text x="48" y="608" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Opłata gminna to jedyna liczba, której nie udało się przypisać do aktu.</text>
  <line x1="48" y1="632" x2="1152" y2="632" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="662" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Każda liczba sprawdzona ze źródłem pierwotnym 30 sierpnia 2026 roku</text>
  <text x="1152" y="662" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>