<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="Three instruments, three dates">
  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Three instruments, three dates</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="232" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">Nationality Act, Lei 37/81</text><text x="48" y="258" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" fill="#7a2230" text-anchor="start">amended 19 May 2026</text><text x="48" y="290" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">How long until citizenship, and what counts as residence</text><line x1="48" y1="328" x2="1152" y2="328" stroke="#dce0e7" stroke-width="1"/><text x="48" y="384" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">Income tax convention</text><text x="48" y="410" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" fill="#7a2230" text-anchor="start">signed 6 September 1994</text><text x="48" y="442" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">Which country taxes what — and the Protocol, para. 1(b), keeps US taxation of US citizens</text><line x1="48" y1="480" x2="1152" y2="480" stroke="#dce0e7" stroke-width="1"/><text x="48" y="536" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">Social security agreement</text><text x="48" y="562" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" fill="#7a2230" text-anchor="start">in force 1 August 1989</text><text x="48" y="594" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">Which system receives contributions. Self-employed resident in Portugal: Portuguese, on form P/USA 1</text>
  <text x="48" y="768" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The saving clause is not in Article 1 of the convention. Article 1 is one sentence about personal scope.</text>
  <line x1="48" y1="792" x2="1152" y2="792" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="822" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 8 September 2026</text>
  <text x="1152" y="822" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>