  <text x="48" y="190" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Cumulative state charges, main applicant</text><rect x="300.0" y="558.4" width="205.5" height="57.6" fill="#7a2230"/><text x="402.75" y="540.4242424242424" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="middle">15,000 €</text><text x="402.75" y="650" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">On submission</text><rect x="515.5" y="385.7" width="205.5" height="230.3" fill="#7a2230"/><text x="618.25" y="367.6969696969697" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="middle">+45,000 €</text><text x="618.25" y="650" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">After approval</text><rect x="731.0" y="243.7" width="205.5" height="372.3" fill="#7a2230"/><text x="833.75" y="225.67676767676767" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="middle">+37,000 €</text><text x="833.75" y="650" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">Contribution</text><rect x="946.5" y="236.0" width="205.5" height="380.0" fill="#7a2230"/><text x="1049.25" y="218" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="middle">+2,000 €</text><text x="1049.25" y="650" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">NGO donation</text><text x="48" y="232" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="start">99,000 € in total</text><line x1="48" y1="608.3" x2="1152" y2="608.3" stroke="#0e1420" stroke-width="1.5" stroke-dasharray