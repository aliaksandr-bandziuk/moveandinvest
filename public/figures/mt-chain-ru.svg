<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Что отменили и чем: четыре даты">
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ГАЙДЫ И ИССЛЕДОВАНИЯ</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Что отменили и чем: четыре даты</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">КОГДА</text><text x="330" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ЧТО СДЕЛАЛИ</text><line x1="48" y1="218" x2="1152" y2="218" stroke="#dce0e7" stroke-width="1"/><text x="48" y="272" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">29 апреля 2025</text><text x="330" y="272" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Дело C-181/23, Комиссия против Мальты</text><text x="330" y="300" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Суд ЕС, Большая палата. На дело не ссылается почти никто</text><line x1="48" y1="350" x2="1152" y2="350" stroke="#dce0e7" stroke-width="1"/><text x="48" y="404" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">24 июля 2025</text><text x="330" y="404" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Акт XXI/2025</text><text x="330" y="432" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Газета 21 474. Заменена статья 10(9) главы 188</text><line x1="48" y1="482" x2="1152" y2="482" stroke="#dce0e7" stroke-width="1"/><text x="48" y="536" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">29 июля 2025</text><text x="330" y="536" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">L.N. 159/2025 — часть IV удалена</text><text x="330" y="564" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Газета 21 478. S.L. 188.06 переписан под заслуги</text><line x1="48" y1="614" x2="1152" y2="614" stroke="#dce0e7" stroke-width="1"/><text x="48" y="668" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#7a2230" text-anchor="start">И всё же, в 2026</text><text x="330" y="668" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#7a2230" text-anchor="start">Страницы фирм по-прежнему предлагают маршрут</text><text x="330" y="696" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Три заголовка на первом экране датированы 2026 годом</text>
  <text x="48" y="808" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Девяносто один день от решения суда до опубликованного текста регламента.</text>
  <line x1="48" y1="832" x2="1152" y2="832" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="862" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Все цифры сверены с первоисточником 9 сентября 2026 года</text>
  <text x="1152" y="862" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>