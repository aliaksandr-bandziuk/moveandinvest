<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Three clocks that comparison tables merge">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Three clocks that comparison tables merge</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="380" y="212" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="start">The permit's clock</text><text x="630" y="212" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="start">Long-term residence</text><text x="880" y="212" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="start">Naturalisation</text><line x1="48" y1="234" x2="1152" y2="234" stroke="#dce0e7" stroke-width="1"/><text x="48" y="288" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start">What it counts</text><text x="380" y="288" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Holding the permit</text><text x="630" y="288" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="630" dy="0">Lawful, uninterrupted</tspan><tspan x="630" dy="25">residence</tspan></text><text x="880" y="288" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Residence actually spent</text><line x1="48" y1="332" x2="1152" y2="332" stroke="#dce0e7" stroke-width="1"/><text x="48" y="384" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start">Time spent abroad</text><text x="380" y="384" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="380" dy="0">In Greece, no obstacle</tspan><tspan x="380" dy="25">(art. 100 §4)</tspan></text><text x="630" y="384" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="630" dy="0">Capped</tspan><tspan x="630" dy="25">(art. 144 §1)</tspan></text><text x="880" y="384" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Does not count</text><line x1="48" y1="428" x2="1152" y2="428" stroke="#dce0e7" stroke-width="1"/><text x="48" y="480" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start">What it gets you</text><text x="380" y="480" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">A valid card</text><text x="630" y="480" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="630" dy="0">Long-term resident</tspan><tspan x="630" dy="25">status</tspan></text><text x="880" y="480" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">A passport</text><line x1="48" y1="524" x2="1152" y2="524" stroke="#dce0e7" stroke-width="1"/><text x="48" y="576" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start">What else it asks</text><text x="380" y="576" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="380" dy="0">The programme's</tspan><tspan x="380" dy="25">own terms</tspan></text><text x="630" y="576" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="630" dy="0">Income and, often,</tspan><tspan x="630" dy="25">language</tspan></text><text x="880" y="576" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="880" dy="0">Language, history</tspan><tspan x="880" dy="25">and culture exams</tspan></text>
  <text x="48" y="668" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">A holder can satisfy the first indefinitely, never start the second and never approach the third.</text>
  <line x1="48" y1="692" x2="1152" y2="692" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="722" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 5 September 2026</text>
  <text x="1152" y="722" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>