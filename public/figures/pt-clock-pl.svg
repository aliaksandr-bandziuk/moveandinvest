  <text x="48" y="250" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Złożone do 18 maja 2026</text><text x="48" y="276" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Rozpatrywane według poprzedniego brzmienia</text><path d="M620 236 h196 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-196 z" fill="#7a2230" opacity="0.70"/><text x="834" y="255" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">5 lat</text><text x="48" y="334" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Obywatele UE i krajów portugalskojęzycznych</text><text x="48" y="360" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Art. 6(1)(b), Lei Orgânica 1/2026</text><path d="M620 320 h276 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-276 z" fill="#7a2230" opacity="0.82"/><text x="914" y="339" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">7 lat</text><text x="48" y="418" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Wszyscy pozostali</text><text x="48" y="444" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Art. 6(1)(b), Lei Orgânica 1/2026</text><path d="M620 404 h396 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-396 z" fill="#7a2230" opacity="1.00"/><text x="1034" y="423" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">10 lat</text>
  <text x="48" y="528" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Lei Orgânica 1/2026 obowiązuje od 19 maja 2026. Sprawy złożone do 18 maja włącznie rozpatruje się według poprzedniego brzmienia.</text>
