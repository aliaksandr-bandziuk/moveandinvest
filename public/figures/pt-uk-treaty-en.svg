<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="1200" height="1000" role="img" aria-label="One convention replaced, fifty-seven years apart">
  <rect width="1200" height="1000" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">One convention replaced, fifty-seven years apart</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="240" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">27 March 1968</text><text x="330" y="240" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">The previous convention signed</text><line x1="48" y1="296" x2="1152" y2="296" stroke="#dce0e7" stroke-width="1"/><text x="48" y="344" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">17 January 1969</text><text x="330" y="344" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">In force, and it stayed in force</text><line x1="48" y1="400" x2="1152" y2="400" stroke="#dce0e7" stroke-width="1"/><text x="48" y="448" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">15 September 2025</text><text x="330" y="448" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Its replacement signed</text><line x1="48" y1="504" x2="1152" y2="504" stroke="#dce0e7" stroke-width="1"/><text x="48" y="552" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#7a2230" text-anchor="start">29 December 2025</text><text x="330" y="552" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#7a2230" text-anchor="start">In force — fifty-seven years after the first signature</text><line x1="48" y1="620" x2="1152" y2="620" stroke="#dce0e7" stroke-width="1"/><text x="48" y="664" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">And the two countries start on different days</text><text x="48" y="706" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Portugal · 1 January 2026</text><text x="48" y="748" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">UK, withheld taxes · 1 January 2026</text><text x="48" y="790" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">UK, corporation tax · 1 April 2026</text><text x="48" y="832" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">UK, income and capital gains · 6 April 2026</text>
  <text x="48" y="908" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">HMRC's own manual carries both, with the note that the previous one applied until the new one took effect.</text>
  <line x1="48" y1="932" x2="1152" y2="932" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="962" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 8 September 2026</text>
  <text x="1152" y="962" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>