  <text x="48" y="210" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Permanent residence programme</text><text x="1152" y="210" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#7a2230" text-anchor="end">No published rule</text><text x="48" y="236" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">About 126,000 € above the price of the property</text><rect x="48" y="258" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="114" y="258" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="180" y="258" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="246" y="258" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="312" y="258" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="378" y="258" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="444" y="258" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="510" y="258" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="576" y="258" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="642" y="258" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="708" y="258" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="774" y="258" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><text x="48" y="350" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Nomad residence permit</text><text x="1152" y="350" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="end">5 months of 12</text><text x="48" y="376" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Income floor 42,000 € a year</text><rect x="48" y="398" width="58" height="42" fill="#7a2230"/><rect x="114" y="398" width="58" height="42" fill="#7a2230"/><rect x="180" y="398" width="58" height="42" fill="#7a2230"/><rect x="246" y="398" width="58" height="42" fill="#7a2230"/><rect x="312" y="398" width="58" height="42" fill="#7a2230"/><rect x="378" y="398" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="444" y="398" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="510" y="398" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="576" y="398" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="642" y="398" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="708" y="398" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><rect x="774" y="398" width="58" height="42" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><text x="48" y="490" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Naturalisation, final year</text><text x="1152" y="490" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="end">12 continuous months</text><text x="48" y="516" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Plus four years inside the six before it</text><rect x="48" y="538" width="58" height="42" fill="#7a2230"/><rect x="114" y="538" width="58" height="42" fill="#7a2230"/><rect x="180" y="538" width="58" height="42" fill="#7a2230"/><rect x="246" y="538" width="58" height="42" fill="#7a2230"/><rect x="312" y="538" width="58" height="42" fill="#7a2230"/><rect x="378" y="538" width="58" height="42" fill="#7a2230"/><rect x="444" y="538" width="58" height="42" fill="#7a2230"/><rect x="510" y="538" width="58" height="42" fill="#7a2230"/><rect x="576" y="538" width="58" height="42" fill="#7a2230"/><rect x="642" y="538" width="58" height="42" fill="#7a2230"/><rect x="708" y="538" width="58" height="42" fill="#7a2230"/><rect x="774" y="538" width="58" height="42" fill="#7a2230"/>
  <text x="48" y="628" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The empty row is a finding rather than an omission: five Maltese registers were walked on 1 September 2026 and none states a rule.</text>
  <line x1="48" y1="652" x2="1152" y2="652" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="682" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 1 September 2026</text>
