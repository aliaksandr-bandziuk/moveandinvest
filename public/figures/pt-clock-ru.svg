<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Сколько лет проживания нужно до гражданства Португалии">
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ГАЙДЫ И ИССЛЕДОВАНИЯ</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Сколько лет проживания нужно до гражданства Португалии</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="250" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Подано до 18 мая 2026</text><text x="48" y="276" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Решается по прежней редакции закона</text><path d="M620 236 h196 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-196 z" fill="#7a2230" opacity="0.70"/><text x="834" y="255" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">5 лет</text><text x="48" y="334" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Граждане ЕС и португалоязычных стран</text><text x="48" y="360" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Ст. 6(1)(b) Lei Orgânica 1/2026</text><path d="M620 320 h276 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-276 z" fill="#7a2230" opacity="0.82"/><text x="914" y="339" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">7 лет</text><text x="48" y="418" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Все остальные</text><text x="48" y="444" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Ст. 6(1)(b) Lei Orgânica 1/2026</text><path d="M620 404 h396 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-396 z" fill="#7a2230" opacity="1.00"/><text x="1034" y="423" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">10 лет</text>
  <text x="48" y="528" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Lei Orgânica 1/2026 действует с 19 мая 2026 года. Дела, поданные до 18 мая включительно, решаются по прежней редакции.</text>
  <line x1="48" y1="552" x2="1152" y2="552" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="582" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Все цифры сверены с первоисточником 28 августа 2026 года</text>
  <text x="1152" y="582" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>