  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">PORADNIKI I BADANIA</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Cztery progi greckiej złotej wizy i co się z każdym wiąże</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="1152" y="214" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="end" letter-spacing="2.93">MINIMALNA POWIERZCHNIA</text><line x1="48" y1="232" x2="1152" y2="232" stroke="#dce0e7" stroke-width="1"/><text x="48" y="280" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="start">800 000 €</text><text x="270" y="280" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Attyka, Saloniki, Mykonos, Thira</text><text x="270" y="306" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Oraz wyspy powyżej 3 100 mieszkańców — art. 100 §2(a)</text><text x="1152" y="280" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#7a2230" text-anchor="end">120 m²</text><line x1="48" y1="342" x2="1152" y2="342" stroke="#dce0e7" stroke-width="1"/><text x="48" y="380" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="start">400 000 €</text><text x="270" y="380" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Pozostała część kraju</text><text x="270" y="406" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Art. 100 §2(b)</text><text x="1152" y="380" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#7a2230" text-anchor="end">120 m²</text><line x1="48" y1="442" x2="1152" y2="442" stroke="#dce0e7" stroke-width="1"/><text x="48" y="480" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="start">250 000 €</text><text x="270" y="480" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Zmiana przeznaczenia na mieszkalne</text><text x="270" y="506" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Prace zakończone przed złożeniem — art. 100 §2(c)</text><text x="1152" y="480" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="end">brak wymogu</text><line x1="48" y1="542" x2="1152" y2="542" stroke="#dce0e7" stroke-width="1"/><text x="48" y="580" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="start">250 000 €</text><text x="270" y="580" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Renowacja budynku zabytkowego</text><text x="270" y="606" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Sprzedaż przed końcem prac jest nieważna — art. 100 §2(d)</text><text x="1152" y="580" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="end">brak wymogu</text>
  <text x="48" y="668" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Zasada „jedna nieruchomość” obowiązuje we wszystkich czterech przypadkach. Minimalna powierzchnia tylko w §2(a) i §2(b).</text>
  <line x1="48" y1="692" x2="1152" y2="692" stroke="#dce0e7" stroke-width="1"/>
