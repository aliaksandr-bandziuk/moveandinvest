  <rect x="48" y="218" width="4" height="52" fill="#7a2230"/><text x="76" y="240" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Portaria 1563/2007, art. 2(2)</text><text x="76" y="266" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The instrument: 100% of the 2026 minimum wage</text><text x="1152" y="240" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#0e1420" text-anchor="end">€920 a month</text><line x1="48" y1="284" x2="1152" y2="284" stroke="#dce0e7" stroke-width="1"/><rect x="48" y="300" width="4" height="52" fill="#5a6478"/><text x="76" y="322" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Wise</text><text x="76" y="348" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The 2023 minimum wage, about 17% below</text><text x="1152" y="322" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#5a6478" text-anchor="end">€760 a month</text><line x1="48" y1="366" x2="1152" y2="366" stroke="#dce0e7" stroke-width="1"/><rect x="48" y="382" width="4" height="52" fill="#5a6478"/><text x="76" y="404" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Greenback Tax Services</text><text x="76" y="430" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The 2021-era figure, about 35% below</text><text x="1152" y="404" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#5a6478" text-anchor="end">€7,200 a year</text><line x1="48" y1="448" x2="1152" y2="448" stroke="#dce0e7" stroke-width="1"/><rect x="48" y="464" width="4" height="52" fill="#5a6478"/><text x="76" y="486" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Global Citizen Solutions, Taxes for Expats</text><text x="76" y="512" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">D8: no figure exists in any instrument</text><text x="1152" y="486" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#5a6478" text-anchor="end">€3,680 a month</text><line x1="48" y1="530" x2="1152" y2="530" stroke="#dce0e7" stroke-width="1"/><rect x="48" y="546" width="4" height="52" fill="#5a6478"/><text x="76" y="568" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Get Golden Visa</text><text x="76" y="594" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">A ten-thousand-word retirement guide</text><text x="1152" y="568" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#5a6478" text-anchor="end">no figure</text>
  <text x="48" y="668" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Checked on 28 August 2026. Every page carries a last-updated stamp newer than its own figure.</text>
