<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" width="1200" height="664" role="img" aria-label="Trzy greckie reżimy podatkowe: 5A, 5B i 5C">
  <rect width="1200" height="664" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">PORADNIKI I BADANIA</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Trzy greckie reżimy podatkowe: 5A, 5B i 5C</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="240" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">5A — 100 000 € rocznie</text><text x="48" y="266" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Cały dochód zagraniczny. Inwestycja 500 000 € w trzy lata</text><text x="48" y="288" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Nierezydent przez 7 z 8 lat</text><path d="M700 226 h326 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-326 z" fill="#7a2230" opacity="1.00"/><text x="1044" y="245" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">15 lat</text><text x="48" y="348" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">5B — 7% dla zagranicznych emerytów</text><text x="48" y="374" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Również cały dochód zagraniczny, nie tylko emerytura</text><text x="48" y="396" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Nierezydent przez 5 z 6 lat</text><path d="M700 334 h326 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-326 z" fill="#7a2230" opacity="1.00"/><text x="1044" y="353" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">15 lat</text><text x="48" y="456" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">5C — 50% dla przenoszących się pracowników</text><text x="48" y="482" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Wyłącznie dochód powstający w samej Grecji</text><text x="48" y="504" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Nierezydent przez 5 z 6 lat</text><path d="M700 442 h150 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-150 z" fill="#7a2230" opacity="0.68"/><text x="868" y="461" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">7 lat</text>
  <text x="48" y="572" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Słupek to okres w latach podatkowych. 5A zaczyna się od pierwszego roku wniosku, 5B od następnego.</text>
  <line x1="48" y1="596" x2="1152" y2="596" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="626" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Każda liczba sprawdzona ze źródłem pierwotnym 28 sierpnia 2026 roku</text>
  <text x="1152" y="626" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
