<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Two tests, and neither is administered in Dubai">
  <rect width="1200" height="640" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Two tests, and neither is administered in Dubai</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="250" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">1 · The UK statutory residence test</text><text x="48" y="280" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#7a2230" text-anchor="start">Have you ceased to be resident in the United Kingdom?</text><text x="48" y="308" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Administered by HMRC. Nothing the Emirates do affects it.</text><line x1="48" y1="346" x2="1152" y2="346" stroke="#dce0e7" stroke-width="1"/><text x="48" y="400" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">2 · Article 4 of the UK–UAE convention, 2016</text><text x="48" y="430" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#7a2230" text-anchor="start">Does the convention treat you as a resident of the UAE?</text><text x="48" y="458" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Domicile, habitual abode or centre of vital interests — not nationality.</text>
  <text x="48" y="548" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The absence of Emirati income tax reaches you only after both are answered.</text>
  <line x1="48" y1="572" x2="1152" y2="572" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="602" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 9 September 2026</text>
  <text x="1152" y="602" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>