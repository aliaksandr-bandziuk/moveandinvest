<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Какие маршруты ВНЖ в Португалии существуют в 2026 году">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ГАЙДЫ И ИССЛЕДОВАНИЯ</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Какие маршруты ВНЖ в Португалии существуют в 2026 году</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="620" y="214" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">НУЖНА ВИЗА</text><text x="830" y="214" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ПРОВЕРКА ДОХОДА</text><line x1="48" y1="232" x2="1152" y2="232" stroke="#dce0e7" stroke-width="1"/><g opacity="1"><text x="48" y="286" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">D7, собственный доход</text><text x="48" y="312" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Пенсия, аренда, дивиденды, роялти</text><text x="620" y="286" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">да</text><text x="830" y="286" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#7a2230" text-anchor="start">920 € в месяц</text></g><line x1="48" y1="330" x2="1152" y2="330" stroke="#dce0e7" stroke-width="1"/><g opacity="1"><text x="48" y="362" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">D8, удалённая работа</text><text x="48" y="388" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Подтверждение трудовых отношений</text><text x="620" y="362" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">да</text><text x="830" y="362" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="start">в законе нет суммы</text></g><line x1="48" y1="406" x2="1152" y2="406" stroke="#dce0e7" stroke-width="1"/><g opacity="1"><text x="48" y="438" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">ВНЖ за инвестиции</text><text x="48" y="464" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Фонд 500 000 € или другой маршрут</text><text x="620" y="438" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="start">нет</text><text x="830" y="438" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#7a2230" text-anchor="start">920 € в месяц</text></g><line x1="48" y1="482" x2="1152" y2="482" stroke="#dce0e7" stroke-width="1"/><g opacity="0.55"><text x="48" y="514" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Покупка недвижимости</text><text x="48" y="540" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Отменена в 2023 году, замены нет</text><text x="620" y="514" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="start">маршрута нет</text></g>
  <text x="48" y="608" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Инвестиционный маршрут снимает визу, но не подтверждение средств: ст. 90-A(1)(a).</text>
  <line x1="48" y1="632" x2="1152" y2="632" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="662" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Все цифры сверены с первоисточником 28 августа 2026 года</text>
  <text x="1152" y="662" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>