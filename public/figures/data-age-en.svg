  <text x="48" y="229" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Greece</text><text x="410" y="229" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="400" fill="#5a6478" text-anchor="end">2024</text><path d="M430 213 h84 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-84 z" fill="#7a2230" opacity="0.46"/><text x="532" y="229" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#0e1420" text-anchor="start">2 years ago</text><text x="48" y="293" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Portugal</text><text x="410" y="293" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="400" fill="#5a6478" text-anchor="end">2022–2023</text><path d="M430 277 h128 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-128 z" fill="#7a2230" opacity="0.51"/><text x="576" y="293" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#0e1420" text-anchor="start">3 years ago</text><text x="48" y="357" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Malta</text><text x="410" y="357" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="400" fill="#5a6478" text-anchor="end">2015</text><path d="M430 341 h480 a4 4 0 0 1 4 4 v14 a4 4 0 0 1 -4 4 h-480 z" fill="#7a2230" opacity="0.95"/><text x="928" y="357" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#0e1420" text-anchor="start">11 years ago</text><text x="48" y="421" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">UAE</text><text x="410" y="421" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="400" fill="#5a6478" text-anchor="end">2014</text><path d="M