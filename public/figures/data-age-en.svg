  <text x="48" y="468" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The bar is the gap between a survey's fieldwork and today. That gap is what makes the four figures incomparable.</text>
