<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Które ścieżki pobytowe w Portugalii istnieją w 2026 roku">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">PORADNIKI I BADANIA</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Które ścieżki pobytowe w Portugalii istnieją w 2026 roku</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="620" y="214" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">WIZA POTRZEBNA</text><text x="830" y="214" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">BADANIE DOCHODU</text><line x1="48" y1="232" x2="1152" y2="232" stroke="#dce0e7" stroke-width="1"/><g opacity="1"><text x="48" y="286" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">D7, dochód własny</text><text x="48" y="312" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Emerytura, najem, dywidendy, tantiemy</text><text x="620" y="286" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">tak</text><text x="830" y="286" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#7a2230" text-anchor="start">920 € miesięcznie</text></g><line x1="48" y1="330" x2="1152" y2="330" stroke="#dce0e7" stroke-width="1"/><g opacity="1"><text x="48" y="362" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">D8, praca zdalna</text><text x="48" y="388" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Potwierdzenie stosunku pracy</text><text x="620" y="362" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">tak</text><text x="830" y="362" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="start">ustawa nie podaje kwoty</text></g><line x1="48" y1="406" x2="1152" y2="406" stroke="#dce0e7" stroke-width="1"/><g opacity="1"><text x="48" y="438" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Pobyt za inwestycję</text><text x="48" y="464" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Fundusz 500 000 € lub inna ścieżka</text><text x="620" y="438" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="start">nie</text><text x="830" y="438" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#7a2230" text-anchor="start">920 € miesięcznie</text></g><line x1="48" y1="482" x2="1152" y2="482" stroke="#dce0e7" stroke-width="1"/><g opacity="0.55"><text x="48" y="514" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Zakup nieruchomości</text><text x="48" y="540" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Zniesiona w 2023 roku, bez zamiennika</text><text x="620" y="514" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="start">ścieżki nie ma</text></g>
  <text x="48" y="608" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Ścieżka inwestycyjna znosi wizę, nie badanie środków utrzymania: art. 90-A(1)(a).</text>
  <line x1="48" y1="632" x2="1152" y2="632" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="662" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Każda liczba sprawdzona ze źródłem pierwotnym 28 sierpnia 2026 roku</text>
  <text x="1152" y="662" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>