<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="From the first permit to a passport">
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">From the first permit to a passport</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <rect x="96" y="278" width="201.60000000000002" height="44" rx="4" fill="#7a2230"/><text x="196.8" y="306" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#ffffff" text-anchor="middle">First title, 2 years</text><rect x="297.6" y="278" width="302.4" height="44" rx="4" fill="#6b7484"/><text x="448.8" y="306" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#ffffff" text-anchor="middle">Renewals, 3 years each</text><line x1="600" y1="222" x2="600" y2="278" stroke="#b9c0cc" stroke-width="1"/><circle cx="600" cy="222" r="7" fill="#7a2230"/><text x="600" y="204" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#0e1420" text-anchor="middle">Permanent residence</text><line x1="801.6" y1="178" x2="801.6" y2="278" stroke="#b9c0cc" stroke-width="1"/><circle cx="801.6" cy="178" r="7" fill="#7a2230"/><text x="801.6" y="160" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#0e1420" text-anchor="middle">Citizenship: EU, CPLP</text><line x1="1104" y1="222" x2="1104" y2="278" stroke="#b9c0cc" stroke-width="1"/><circle cx="1104" cy="222" r="7" fill="#7a2230"/><text x="1120" y="204" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#0e1420" text-anchor="end">Citizenship: others</text><text x="96" y="352" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">0</text><text x="196.8" y="352" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">1</text><text x="297.6" y="352" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">2</text><text x="398.4" y="352" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">3</text><text x="499.2" y="352" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">4</text><text x="600" y="352" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">5</text><text x="700.8" y="352" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">6</text><text x="801.6" y="352" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">7</text><text x="902.4" y="352" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">8</text><text x="1003.2" y="352" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">9</text><text x="1104" y="352" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">10</text><text x="96" y="392" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Years of legal residence</text><text x="96" y="436" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start">The permanent authorisation itself has no expiry — art. 76(1). Only its card is renewed, every five years.</text>
  <text x="48" y="508" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Years of legal residence, not calendar years: a permit renewed from abroad advances the bands and none of the markers.</text>
  <line x1="48" y1="532" x2="1152" y2="532" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="562" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 4 September 2026</text>
  <text x="1152" y="562" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>