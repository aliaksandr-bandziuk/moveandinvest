<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Три вопроса, которые Мальта решает по-разному">
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ГАЙДЫ И ИССЛЕДОВАНИЯ</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Три вопроса, которые Мальта решает по-разному</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ВОПРОС</text><text x="700" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ЧЕМ РЕШАЕТСЯ</text><line x1="48" y1="218" x2="1152" y2="218" stroke="#dce0e7" stroke-width="1"/><text x="48" y="268" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Можно ли вам жить на Мальте</text><text x="48" y="294" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">На это и отвечает сертификат MPRP</text><text x="700" y="268" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">S.L. 217.26</text><line x1="48" y1="326" x2="1152" y2="326" stroke="#dce0e7" stroke-width="1"/><text x="48" y="376" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Облагает ли вас Мальта</text><text x="48" y="402" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Сертификат к этому отношения не имеет</text><text x="700" y="376" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Более 183 дней в году</text><line x1="48" y1="434" x2="1152" y2="434" stroke="#dce0e7" stroke-width="1"/><text x="48" y="484" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">С чего именно облагает</text><text x="48" y="510" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Всемирный доход либо только переведённое</text><text x="700" y="484" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Домицилий и обычное резидентство</text>
  <text x="48" y="528" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Сертификат MPRP отвечает только на первый. Два других решаются без него.</text>
  <line x1="48" y1="552" x2="1152" y2="552" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="582" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Все цифры сверены с первоисточником 1 сентября 2026 года</text>
  <text x="1152" y="582" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>