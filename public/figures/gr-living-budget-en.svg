  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Where a Greek household's money goes</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="237" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Food and non-alcoholic drinks</text><path d="M430 218 h401.375 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-401.375 z" fill="#7a2230"/><text x="849.375" y="237" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">20.7 %</text><text x="1152" y="237" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="end">356.68 €</text><text x="48" y="311" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Housing</text><path d="M430 292 h278 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-278 z" fill="#7a2230"/><text x="726" y="311" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">14.4 %</text><text x="1152" y="311" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="end">247.51 €</text><text x="48" y="385" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Transport</text><path d="M430 366 h256.4583333333333 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-256.4583333333333 z" fill="#7a2230"/><text x="704.4583333333333" y="385" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">13.3 %</text><text x="1152" y="385" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="end">229.75 €</text><text x="48" y="459" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Restaurants, cafés and hotels</text><path d="M430 440 h227.08333333333334 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-227.08333333333334 z" fill="#7a2230"/><text x="675.0833333333334" y="459" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">11.8 %</text><text x="1152" y="459" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="end">203.87 €</text><text x="48" y="533" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Health</text><path d="M430 514 h148.75 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-148.75 z" fill="#7a2230"/><text x="596.75" y="533" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">7.8 %</text><text x="1152" y="533" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="end">134.46 €</text>
  <text x="48" y="608" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Shares of average monthly expenditure, 1,724.54 € in total. Renting households put 17.1 % of all spending into rent alone.</text>
  <line x1="48" y1="632" x2="1152" y2="632" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="662" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 4 September 2026</text>
  <text x="1152" y="662" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
