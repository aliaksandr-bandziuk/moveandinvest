<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Какие маршруты проверяют доход, а какие нет">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ГАЙДЫ И ИССЛЕДОВАНИЯ</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Какие маршруты проверяют доход, а какие нет</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <rect x="48" y="176" width="516" height="3" fill="#6b7484"/><text x="48" y="216" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ДОХОД НЕ ПРОВЕРЯЮТ</text><text x="48" y="268" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Греция, ВНЖ за инвестиции</text><text x="48" y="294" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">только стоимость объекта</text><line x1="48" y1="312" x2="564" y2="312" stroke="#dce0e7" stroke-width="1"/><text x="48" y="334" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Мальта, MPRP</text><text x="48" y="360" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">активы, 500 000 €</text><line x1="48" y1="378" x2="564" y2="378" stroke="#dce0e7" stroke-width="1"/><text x="48" y="400" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">ОАЭ, золотая виза</text><text x="48" y="426" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">только стоимость объекта</text><rect x="636" y="176" width="516" height="3" fill="#7a2230"/><text x="636" y="216" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ДОХОД ПРОВЕРЯЮТ</text><text x="636" y="268" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Португалия, ВНЖ за инвестиции</text><text x="636" y="294" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#0e1420" text-anchor="start">920 € в месяц</text><line x1="636" y1="312" x2="1152" y2="312" stroke="#dce0e7" stroke-width="1"/><text x="636" y="334" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Португалия, виза D7</text><text x="636" y="360" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#0e1420" text-anchor="start">920 € в месяц</text><line x1="636" y1="378" x2="1152" y2="378" stroke="#dce0e7" stroke-width="1"/><text x="636" y="400" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Греция, финансово независимое лицо</text><text x="636" y="426" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#0e1420" text-anchor="start">3 500 € в месяц</text><line x1="636" y1="444" x2="1152" y2="444" stroke="#dce0e7" stroke-width="1"/><text x="636" y="466" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Греция, цифровой кочевник</text><text x="636" y="492" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#0e1420" text-anchor="start">3 500 € в месяц</text><line x1="636" y1="510" x2="1152" y2="510" stroke="#dce0e7" stroke-width="1"/><text x="636" y="532" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Мальта, цифровой кочевник</text><text x="636" y="558" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#0e1420" text-anchor="start">42 000 € в год</text><line x1="636" y1="576" x2="1152" y2="576" stroke="#dce0e7" stroke-width="1"/><text x="636" y="598" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">ОАЭ, удалённая работа</text><text x="636" y="624" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#0e1420" text-anchor="start">5 000 $ в месяц</text>
  <text x="48" y="668" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Каждая сумма приведена в том периоде, в каком её устанавливает акт: у Мальты — за год, у ОАЭ — в долларах.</text>
  <line x1="48" y1="692" x2="1152" y2="692" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="722" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Все цифры сверены с первоисточником 28 августа 2026 года</text>
  <text x="1152" y="722" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>