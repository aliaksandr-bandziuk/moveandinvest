<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="One year at nothing, three at 10%, then a wall">
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">One year at nothing, three at 10%, then a wall</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="190" y="278" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">Year 1</text><rect x="100" y="300" width="180" height="90" rx="4" fill="#ffffff" stroke="#7a2230" stroke-width="1.5" stroke-dasharray="6 4"/><text x="190" y="338" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#0e1420" text-anchor="middle"><tspan x="190" dy="0">No Maltese</tspan><tspan x="190" dy="28">tax charge</tspan></text><text x="380" y="278" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">Year 2</text><rect x="290" y="300" width="180" height="90" rx="4" fill="#7a2230" stroke="#7a2230" stroke-width="0"/><text x="380" y="338" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#ffffff" text-anchor="middle"><tspan x="380" dy="0">10% on</tspan><tspan x="380" dy="28">authorised work</tspan></text><text x="570" y="278" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">Year 3</text><rect x="480" y="300" width="180" height="90" rx="4" fill="#7a2230" stroke="#7a2230" stroke-width="0"/><text x="570" y="338" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#ffffff" text-anchor="middle"><tspan x="570" dy="0">10% on</tspan><tspan x="570" dy="28">authorised work</tspan></text><text x="760" y="278" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">Year 4</text><rect x="670" y="300" width="180" height="90" rx="4" fill="#7a2230" stroke="#7a2230" stroke-width="0"/><text x="760" y="338" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#ffffff" text-anchor="middle"><tspan x="760" dy="0">10% on</tspan><tspan x="760" dy="28">authorised work</tspan></text><line x1="872" y1="260" x2="872" y2="430" stroke="#0e1420" stroke-width="3"/><text x="892" y="314" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#0e1420" text-anchor="start"><tspan x="892" dy="0">Four years maximum.</tspan><tspan x="892" dy="28">No renewal, and no</tspan><tspan x="892" dy="28">onward status.</tspan></text><text x="100" y="452" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Five months in every twelve, proved by bank statements</text>
  <text x="48" y="528" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The window runs twelve months from the later of the permit's issue or 1 January 2024.</text>
  <line x1="48" y1="552" x2="1152" y2="552" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="582" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 5 September 2026</text>
  <text x="1152" y="582" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>