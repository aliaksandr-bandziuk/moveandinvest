<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-label="When both countries claim you: four steps, in order">
  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">When both countries claim you: four steps, in order</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="240" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="29" font-weight="600" fill="#5a6478" text-anchor="start">1</text><text x="130" y="240" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">A permanent home available to you</text><text x="130" y="268" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Available, not lived in. A flat kept empty in Britain is available. If a home is available in both: centre of vital interests</text><line x1="48" y1="306" x2="1152" y2="306" stroke="#dce0e7" stroke-width="1"/><text x="48" y="360" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="29" font-weight="600" fill="#5a6478" text-anchor="start">2</text><text x="130" y="360" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">Habitual abode</text><text x="130" y="388" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Reached only if the centre of vital interests cannot be determined, or no home is available in either state</text><line x1="48" y1="426" x2="1152" y2="426" stroke="#dce0e7" stroke-width="1"/><text x="48" y="480" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="29" font-weight="600" fill="#7a2230" text-anchor="start">3</text><text x="130" y="480" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#7a2230" text-anchor="start">Nationality</text><text x="130" y="508" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The passport is the third step of four, not the first</text><line x1="48" y1="546" x2="1152" y2="546" stroke="#dce0e7" stroke-width="1"/><text x="48" y="600" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="29" font-weight="600" fill="#5a6478" text-anchor="start">4</text><text x="130" y="600" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">The two tax authorities agree</text><text x="130" y="628" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Only for a national of both states or of neither</text>
  <text x="48" y="688" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Article 4(3) of the convention signed 12 April 2016, in force 25 December 2016.</text>
  <line x1="48" y1="712" x2="1152" y2="712" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="742" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 9 September 2026</text>
  <text x="1152" y="742" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>