<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" width="1200" height="664" role="img" aria-label="Три налоговых режима Греции: 5A, 5B и 5C">
  <rect width="1200" height="664" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ГАЙДЫ И ИССЛЕДОВАНИЯ</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Три налоговых режима Греции: 5A, 5B и 5C</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="240" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">5A — 100 000 € в год</text><text x="48" y="266" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Весь зарубежный доход. Инвестиция 500 000 € за три года</text><text x="48" y="288" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Не резидент 7 из 8 лет</text><path d="M700 226 h326 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-326 z" fill="#7a2230" opacity="1.00"/><text x="1044" y="245" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">15 лет</text><text x="48" y="348" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">5B — 7% для иностранных пенсионеров</text><text x="48" y="374" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Тоже весь зарубежный доход, а не только пенсия</text><text x="48" y="396" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Не резидент 5 из 6 лет</text><path d="M700 334 h326 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-326 z" fill="#7a2230" opacity="1.00"/><text x="1044" y="353" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">15 лет</text><text x="48" y="456" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">5C — 50% для переезжающих работников</text><text x="48" y="482" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Только доход, возникающий в самой Греции</text><text x="48" y="504" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Не резидент 5 из 6 лет</text><path d="M700 442 h150 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-150 z" fill="#7a2230" opacity="0.68"/><text x="868" y="461" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">7 лет</text>
  <text x="48" y="572" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Полоса — срок в налоговых годах. 5A начинается с первого года подачи, 5B — со следующего.</text>
  <line x1="48" y1="596" x2="1152" y2="596" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="626" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Все цифры сверены с первоисточником 28 августа 2026 года</text>
  <text x="1152" y="626" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>