<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="What the permit costs, by the basis you applied under">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">What the permit costs, by the basis you applied under</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="250" font-family="Inter, system-ui, sans-serif" font-size="29" font-weight="600" fill="#0e1420" text-anchor="start">€500</text><text x="260" y="250" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">Long-term residence</text><line x1="48" y1="278" x2="1152" y2="278" stroke="#dce0e7" stroke-width="1"/><text x="48" y="306" font-family="Inter, system-ui, sans-serif" font-size="29" font-weight="600" fill="#0e1420" text-anchor="start">€100</text><text x="260" y="306" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="260" dy="0">Economic self-sufficiency</tspan><tspan x="260" dy="28">Posted workers</tspan><tspan x="260" dy="28">Permanent residence scheme, renewals only</tspan></text><line x1="48" y1="388" x2="1152" y2="388" stroke="#dce0e7" stroke-width="1"/><text x="48" y="416" font-family="Inter, system-ui, sans-serif" font-size="29" font-weight="600" fill="#0e1420" text-anchor="start">€50</text><text x="260" y="416" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="260" dy="0">Study and post-study; traineeship</tspan><tspan x="260" dy="28">Family reunification (S.L. 217.06) and the family member policy</tspan><tspan x="260" dy="28">Partner, child or parent of a Maltese citizen; medical, religious, temporary</tspan></text><line x1="48" y1="498" x2="1152" y2="498" stroke="#dce0e7" stroke-width="1"/><text x="48" y="526" font-family="Inter, system-ui, sans-serif" font-size="29" font-weight="600" fill="#0e1420" text-anchor="start">Free</text><text x="260" y="526" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="260" dy="0">Exempt persons</tspan><tspan x="260" dy="28">Victims of human trafficking</tspan><tspan x="260" dy="28">Volunteers</tspan></text>
  <text x="48" y="668" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Under economic self-sufficiency a further €100 at renewal buys a two-year permit instead of a one-year one.</text>
  <line x1="48" y1="692" x2="1152" y2="692" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="722" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 5 September 2026</text>
  <text x="1152" y="722" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>