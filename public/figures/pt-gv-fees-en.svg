<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="What AIMA charges, and the ratio nobody warns about">
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">What AIMA charges, and the ratio nobody warns about</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="196" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Fees payable to AIMA, in force from 1 March 2026. Each charge stands on its own; they are not paid at once.</text><rect x="120.0" y="568.6" width="228.0" height="35.4" fill="#7a2230"/><text x="234" y="550.561736093789" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="middle">842.80 €</text><text x="234" y="638" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="middle">To consider the application</text><rect x="388.0" y="250.0" width="228.0" height="354.0" fill="#7a2230"/><text x="502" y="232" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="middle">8,418.90 €</text><text x="502" y="638" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="middle">To issue the permit</text><rect x="656.0" y="427.0" width="228.0" height="177.0" fill="#7a2230"/><text x="770" y="408.964258988704" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="middle">4,210.30 €</text><text x="770" y="638" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="middle">To renew it</text><rect x="924.0" y="250.0" width="228.0" height="354.0" fill="#7a2230"/><text x="1038" y="232" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="middle">8,418.90 €</text><text x="1038" y="638" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="middle">Each family member</text><line x1="48" y1="604" x2="1152" y2="604" stroke="#b9c0cc" stroke-width="1"/><text x="48" y="700" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0e1420" text-anchor="start">One applicant, filing to first renewal: about 13,470 € in fees alone.</text><text x="48" y="728" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0e1420" text-anchor="start">A family of three: about 40,400 €.</text><text x="48" y="758" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Less 25% when the application is filed online.</text>
  <text x="48" y="808" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Legal fees and fund commissions are excluded: those are market prices, not published ones.</text>
  <line x1="48" y1="832" x2="1152" y2="832" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="862" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 6 September 2026</text>
  <text x="1152" y="862" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>