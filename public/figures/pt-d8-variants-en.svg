<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" width="1200" height="1060" role="img" aria-label="One name, two visas, one income test">
  <rect width="1200" height="1060" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">One name, two visas, one income test</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="380" y="208" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="start">Temporary stay</text><text x="780" y="208" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">Residence</text><line x1="48" y1="228" x2="1152" y2="228" stroke="#dce0e7" stroke-width="1"/><text x="48" y="276" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">Created by</text><text x="380" y="276" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start"><tspan x="380" dy="0">Art. 54(1)(i)</tspan><tspan x="380" dy="29">of Lei 23/2007</tspan></text><text x="780" y="276" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start"><tspan x="780" dy="0">Art. 61-B</tspan><tspan x="780" dy="29">of Lei 23/2007</tspan></text><line x1="48" y1="332" x2="1152" y2="332" stroke="#dce0e7" stroke-width="1"/><text x="48" y="376" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">Paperwork rule</text><text x="380" y="376" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start"><tspan x="380" dy="0">Art. 18-B</tspan><tspan x="380" dy="29">of DR 84/2007</tspan></text><text x="780" y="376" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start"><tspan x="780" dy="0">Art. 31-A</tspan><tspan x="780" dy="29">of DR 84/2007</tspan></text><line x1="48" y1="432" x2="1152" y2="432" stroke="#dce0e7" stroke-width="1"/><text x="48" y="476" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">Length</text><text x="380" y="476" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Under one year</text><text x="780" y="476" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Leads to a permit</text><line x1="48" y1="532" x2="1152" y2="532" stroke="#dce0e7" stroke-width="1"/><text x="48" y="576" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">Income test</text><text x="380" y="576" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start"><tspan x="380" dy="0">Four minimum wages,</tspan><tspan x="380" dy="29">three-month average</tspan></text><text x="780" y="576" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start"><tspan x="780" dy="0">The same,</tspan><tspan x="780" dy="29">word for word</tspan></text><line x1="48" y1="632" x2="1152" y2="632" stroke="#dce0e7" stroke-width="1"/><text x="48" y="676" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">Leads to a residence permit</text><text x="380" y="676" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#5a6478" text-anchor="start">No</text><text x="780" y="676" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">Yes</text><line x1="48" y1="732" x2="1152" y2="732" stroke="#dce0e7" stroke-width="1"/><text x="48" y="776" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">On the art. 122 conversion list</text><text x="380" y="776" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#5a6478" text-anchor="start">No</text><text x="780" y="776" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">Not applicable</text><line x1="48" y1="832" x2="1152" y2="832" stroke="#dce0e7" stroke-width="1"/><text x="48" y="876" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">Counts towards naturalisation</text><text x="380" y="876" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#5a6478" text-anchor="start">No</text><text x="780" y="876" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start"><tspan x="780" dy="0">Yes, as</tspan><tspan x="780" dy="29">lawful residence</tspan></text>
  <text x="48" y="968" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Both variants are called the D8, and the euro figure quoted for them fits both — which is how it hides that there are two.</text>
  <line x1="48" y1="992" x2="1152" y2="992" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="1022" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 7 September 2026</text>
  <text x="1152" y="1022" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>