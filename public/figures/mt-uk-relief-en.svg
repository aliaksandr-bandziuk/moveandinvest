<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Article 23(1): the relief narrows to what Malta taxes">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Article 23(1): the relief narrows to what Malta taxes</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="260" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="29" font-weight="600" fill="#5a6478" text-anchor="start">1</text><text x="130" y="260" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#0e1420" text-anchor="start">The convention relieves the income in one state</text><text x="130" y="290" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">Article 18 sends a private pension to the state of residence</text><line x1="48" y1="330" x2="1152" y2="330" stroke="#dce0e7" stroke-width="1"/><text x="48" y="390" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="29" font-weight="600" fill="#5a6478" text-anchor="start">2</text><text x="130" y="390" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#0e1420" text-anchor="start">The other state taxes it only on the amount remitted</text><text x="130" y="420" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">Maltese law taxes a non-domiciled resident on what is brought in</text><line x1="48" y1="460" x2="1152" y2="460" stroke="#dce0e7" stroke-width="1"/><text x="48" y="520" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="29" font-weight="600" fill="#7a2230" text-anchor="start">3</text><text x="130" y="520" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="600" fill="#7a2230" text-anchor="start">The relief applies only to the part that other state taxes</text><text x="130" y="550" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">So the part you do not remit is not sheltered by the treaty either</text>
  <text x="48" y="608" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">UK-Malta convention signed 12 May 1994, in force 27 March 1995.</text>
  <line x1="48" y1="632" x2="1152" y2="632" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="662" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 9 September 2026</text>
  <text x="1152" y="662" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>