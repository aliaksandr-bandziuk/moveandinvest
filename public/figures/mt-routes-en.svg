<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" role="img" aria-label="Two routes, and only one of them has a price">
  <rect width="1200" height="980" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Two routes, and only one of them has a price</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="400" y="208" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="start">Naturalisation on merit</text><text x="780" y="208" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="start">Ordinary naturalisation</text><line x1="48" y1="228" x2="1152" y2="228" stroke="#dce0e7" stroke-width="1"/><text x="48" y="282" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">Residence required</text><text x="400" y="282" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">At least eight months</text><text x="780" y="282" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Five years, spread over up to seven</text><line x1="48" y1="344" x2="1152" y2="344" stroke="#dce0e7" stroke-width="1"/><text x="48" y="400" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">The application must show</text><text x="400" y="400" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Property and language</text><text x="780" y="400" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">The ordinary conditions of Cap. 188</text><line x1="48" y1="462" x2="1152" y2="462" stroke="#dce0e7" stroke-width="1"/><text x="48" y="518" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">Decided on</text><text x="400" y="518" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Six named grounds</text><text x="780" y="518" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Length of residence</text><line x1="48" y1="580" x2="1152" y2="580" stroke="#dce0e7" stroke-width="1"/><text x="48" y="636" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">Overseen by</text><text x="400" y="636" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">A separate Office of the Regulator</text><text x="780" y="636" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">The ordinary process</text><line x1="48" y1="698" x2="1152" y2="698" stroke="#dce0e7" stroke-width="1"/><text x="48" y="754" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="500" fill="#5a6478" text-anchor="start">Fee in the instrument</text><text x="400" y="754" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">None published</text><text x="780" y="754" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">Outside these regulations</text>
  <text x="48" y="888" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The merit regulations set no fee: they say fees established by the Agency apply. No figure exists in the instrument.</text>
  <line x1="48" y1="912" x2="1152" y2="912" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="942" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 7 September 2026</text>
  <text x="1152" y="942" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>