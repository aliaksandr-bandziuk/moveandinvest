<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" role="img" aria-label="The UK-Greece convention in force, signed 1953">
  <rect width="1200" height="830" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">The UK-Greece convention in force, signed 1953</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="250" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#5a6478" text-anchor="start">Signed</text><text x="360" y="250" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="600" fill="#7a2230" text-anchor="start">25 June 1953</text><text x="360" y="278" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Brought into UK law by Statutory Instrument 1954 No. 142</text><line x1="48" y1="308" x2="1152" y2="308" stroke="#dce0e7" stroke-width="1"/><text x="48" y="346" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#5a6478" text-anchor="start">In force</text><text x="360" y="346" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="600" fill="#0e1420" text-anchor="start">15 January 1954</text><text x="360" y="374" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">No protocol has amended it since</text><line x1="48" y1="404" x2="1152" y2="404" stroke="#dce0e7" stroke-width="1"/><text x="48" y="442" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#5a6478" text-anchor="start">Effect in Greece</text><text x="360" y="442" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="600" fill="#0e1420" text-anchor="start">Financial year beginning 1 July 1951</text><text x="360" y="470" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Companies from the accounting year ended after 1 March 1951</text><line x1="48" y1="500" x2="1152" y2="500" stroke="#dce0e7" stroke-width="1"/><text x="48" y="538" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#5a6478" text-anchor="start">Effect in the UK</text><text x="360" y="538" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="600" fill="#0e1420" text-anchor="start">6 April 1952, income and capital gains tax</text><text x="360" y="566" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">1 April 1954 for corporation tax</text><line x1="48" y1="596" x2="1152" y2="596" stroke="#dce0e7" stroke-width="1"/><text x="48" y="634" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#5a6478" text-anchor="start">Synthesised MLI text</text><text x="360" y="634" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="600" fill="#7a2230" text-anchor="start">Not published for Greece</text><text x="360" y="662" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">One is published for the 1994 UK-Malta convention</text>
  <text x="48" y="738" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Read on 9 September 2026 on gov.uk and in the text of SI 1954 No. 142.</text>
  <line x1="48" y1="762" x2="1152" y2="762" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="792" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 9 September 2026</text>
  <text x="1152" y="792" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>