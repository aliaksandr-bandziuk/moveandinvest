<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Naturalisation is two articles, not one">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Naturalisation is two articles, not one</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="208" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ARTICLE</text><text x="300" y="208" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">WHAT IT HOLDS</text><line x1="48" y1="228" x2="1152" y2="228" stroke="#dce0e7" stroke-width="1"/><text x="48" y="282" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="27" font-weight="600" fill="#0e1420" text-anchor="start">5</text><text x="300" y="282" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Formal conditions</text><text x="300" y="310" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Legal age, no conviction in the last decade, no pending expulsion, the period, the title</text><line x1="48" y1="344" x2="1152" y2="344" stroke="#dce0e7" stroke-width="1"/><text x="48" y="400" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="27" font-weight="600" fill="#7a2230" text-anchor="start">5Α</text><text x="300" y="400" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#7a2230" text-anchor="start">Substantive conditions</text><text x="300" y="428" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Sufficient Greek; history, geography, culture and customs; economic and social integration</text><line x1="48" y1="462" x2="1152" y2="462" stroke="#dce0e7" stroke-width="1"/><text x="48" y="518" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="27" font-weight="600" fill="#0e1420" text-anchor="start">5Β</text><text x="300" y="518" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Security grounds</text><text x="300" y="546" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Assessed separately from everything above</text>
  <text x="48" y="608" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The examination sits in article 5Α, and it names no CEFR level. The B1 in circulation comes from below the statute.</text>
  <line x1="48" y1="632" x2="1152" y2="632" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="662" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 8 September 2026</text>
  <text x="1152" y="662" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>