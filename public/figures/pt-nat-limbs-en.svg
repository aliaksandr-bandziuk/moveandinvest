<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 960" width="1200" height="960" role="img" aria-label="What article 6(1) asks, and what is new">
  <rect width="1200" height="960" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">What article 6(1) asks, and what is new</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ARTICLE</text><text x="210" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">WHAT IT REQUIRES</text><text x="980" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">STATUS</text><line x1="48" y1="218" x2="1152" y2="218" stroke="#dce0e7" stroke-width="1"/><text x="48" y="272" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">6(1)(a)</text><text x="210" y="272" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="210" dy="0">Legal age under Portuguese law</tspan><tspan x="210" dy="29">or under the law of origin</tspan></text><text x="980" y="272" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#5a6478" text-anchor="start">Unchanged</text><line x1="48" y1="334" x2="1152" y2="334" stroke="#dce0e7" stroke-width="1"/><text x="48" y="390" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#0e1420" text-anchor="start">6(1)(b)</text><text x="210" y="390" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start"><tspan x="210" dy="0">Seven years of legal residence for EU and</tspan><tspan x="210" dy="29">CPLP citizens, ten for everybody else</tspan></text><text x="980" y="390" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">Doubled in 2026</text><line x1="48" y1="452" x2="1152" y2="452" stroke="#dce0e7" stroke-width="1"/><text x="48" y="508" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#0e1420" text-anchor="start">6(1)(c)</text><text x="210" y="508" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start"><tspan x="210" dy="0">Sufficient knowledge of the language, and</tspan><tspan x="210" dy="29">of Portuguese culture, history, symbols</tspan></text><text x="980" y="508" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">Widened in 2026</text><line x1="48" y1="570" x2="1152" y2="570" stroke="#dce0e7" stroke-width="1"/><text x="48" y="626" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#0e1420" text-anchor="start">6(1)(d)</text><text x="210" y="626" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start"><tspan x="210" dy="0">Sufficient knowledge of the rights and</tspan><tspan x="210" dy="29">duties of nationality, and of the state</tspan></text><text x="980" y="626" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">New in 2026</text><line x1="48" y1="688" x2="1152" y2="688" stroke="#dce0e7" stroke-width="1"/><text x="48" y="744" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#0e1420" text-anchor="start">6(1)(e)</text><text x="210" y="744" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start"><tspan x="210" dy="0">A solemn declaration of adherence to the</tspan><tspan x="210" dy="29">principles of the democratic rule of law</tspan></text><text x="980" y="744" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">New in 2026</text>
  <text x="48" y="868" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The statute names no CEFR level in limb (c). A2 is administrative practice, which is a different thing with a different future.</text>
  <line x1="48" y1="892" x2="1152" y2="892" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="922" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 7 September 2026</text>
  <text x="1152" y="922" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>