ke-width="1"/><text x="636" y="334" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Portugal, D7 visa</text><text x="636" y="360" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#0e1420" text-anchor="start">€920 a month</text><line x1="636" y1="378" x2="1152" y2="378" stroke="#dce0e7" stroke-width="1"/><text x="636" y="400" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Greece, financially independent</text><text x="636" y="426" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#0e1420" text-anchor="start">€3,500 a month</text><line x1="636" y1="444" x2="1152" y2="444" stroke="#dce0e7" stroke-width="1"/><text x="636" y="466" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Greece, digital nomad</text><text x="636" y="492" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#0e1420" text-anchor="start">€3,500 a month</text><line x1="636" y1="510" x2="1152" y2="510" stroke="#dce0e7" stroke-width="1"/><text x="636" y="532" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Malta, nomad permit</text><text x="636" y="558" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#0e1420" text-anchor="start">€42,000 a year</text><line x1="636" y1="576" x2="1152" y2="576" stroke="#dce0e7" stroke-width="1"/><text x="636" y="598" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">UAE, virtual working</text><text x="636" y="624" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="19" font-weight="400" fill="#0e1420" text-anchor="start">USD 5,000 a month</text>
