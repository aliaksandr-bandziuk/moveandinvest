  <text x="48" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">SUBPARAGRAPH</text><text x="320" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">WHAT IT ASKS</text><text x="940" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">STATUS</text><line x1="48" y1="218" x2="1152" y2="218" stroke="#dce0e7" stroke-width="1"/><text x="48" y="262" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">i</text><text x="320" y="262" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#5a6478" text-anchor="start" text-decoration="line-through">Capital transfer of 1.5m €</text><text x="940" y="262" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">Repealed 2023</text><line x1="48" y1="302" x2="1152" y2="302" stroke="#dce0e7" stroke-width="1"/><text x="48" y="336" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#0e1420" text-anchor="start">ii</text><text x="320" y="336" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Ten jobs created</text><text x="320" y="361" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Eight in low-density areas. No capital threshold at all</text><text x="940" y="336" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">In force</text><line x1="48" y1="376" x2="1152" y2="376" stroke="#dce0e7" stroke-width="1"/><text x="48" y="410" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">iii</text><text x="320" y="410" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#5a6478" text-anchor="start" text-decoration="line-through">Property purchase</text><text x="940" y="410" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">Repealed 2023</text><line x1="48" y1="450" x2="1152" y2="450" stroke="#dce0e7" stroke-width="1"/><text x="48" y="484" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">iv</text><text x="320" y="484" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#5a6478" text-anchor="start" text-decoration="line-through">Property purchase plus rehabilitation</text><text x="940" y="484" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#7a2230" text-anchor="start">Repealed 2023</text><line x1="48" y1="524" x2="1152" y2="524" stroke="#dce0e7" stroke-width="1"/><text x="48" y="558" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#0e1420" text-anchor="start">v</text><text x="320" y="558" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">500,000 € into research</text><text x="320" y="583" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">400,000 € in low-density areas</text><text x="940" y="558" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">In force</text><line x1="48" y1="598" x2="1152" y2="598" stroke="#dce0e7" stroke-width="1"/><text x="48" y="632" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#0e1420" text-anchor="start">vi</text><text x="320" y="632" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">250,000 € into cultural heritage</text><text x="320" y="657" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">220,000 € in low-density areas</text><text x="940" y="632" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">In force</text><line x1="48" y1="672" x2="1152" y2="672" stroke="#dce0e7" stroke-width="1"/><text x="48" y="706" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#0e1420" text-anchor="start">vii</text><text x="320" y="706" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">500,000 € into a fund</text><text x="320" y="731" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Not a real-estate fund, five years, 60% seated in Portugal</text><text x="940" y="706" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">In force</text><line x1="48" y1="746" x2="1152" y2="746" stroke="#dce0e7" stroke-width="1"/><text x="48" y="780" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#0e1420" text-anchor="start">viii</text><text x="320" y="780" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">500,000 € into a company creating five jobs</text><text x="940" y="780" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">In force</text>
  <text x="48" y="888" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Article 53 of Lei 56/2023 repealed three subparagraphs at once; article 3(5) closes the fund workaround.</text>
