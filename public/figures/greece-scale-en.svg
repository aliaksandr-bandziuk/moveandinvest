<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="What Greece asks you to prove against what Greece costs">
  <rect width="1200" height="540" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">What Greece asks you to prove against what Greece costs</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="237" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Required to prove</text><path d="M430 218 h491.8333333333333 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-491.8333333333333 z" fill="#7a2230"/><text x="939.8333333333333" y="237" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">3,500 €</text><text x="48" y="319" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Average household spends</text><path d="M430 300 h240.30983333333333 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-240.30983333333333 z" fill="#7a2230"/><text x="688.3098333333334" y="319" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">1,724.54 €</text><text x="48" y="401" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Minimum wage</text><path d="M430 382 h126.33333333333334 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-126.33333333333334 z" fill="#7a2230"/><text x="574.3333333333334" y="401" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">920 €</text>
  <text x="48" y="448" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The threshold and the minimum wage are 2026 figures; household spending is the 2024 survey.</text>
  <line x1="48" y1="472" x2="1152" y2="472" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="502" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 28 August 2026</text>
  <text x="1152" y="502" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
