<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="The premium a foreign tax domicile pays">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">The premium a foreign tax domicile pays</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="200" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Median price per square metre by the buyer's tax domicile, Q4 2025. Index, not euros.</text><rect x="360.0" y="280.6" width="351.0" height="279.4" fill="#7a2230"/><text x="535.5" y="260.625" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="600" fill="#0e1420" text-anchor="middle">149.0</text><text x="535.5" y="594" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="middle">Greater Lisbon</text><rect x="801.0" y="305.8" width="351.0" height="254.3" fill="#7a2230"/><text x="976.5" y="285.75" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="600" fill="#0e1420" text-anchor="middle">135.6</text><text x="976.5" y="594" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="middle">Porto Metropolitan Area</text><line x1="48" y1="372.5" x2="1152" y2="372.5" stroke="#0e1420" stroke-width="2"/><text x="48" y="358.5" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="600" fill="#0e1420" text-anchor="start">100 — domiciled in Portugal</text><line x1="48" y1="560" x2="1152" y2="560" stroke="#b9c0cc" stroke-width="1"/>
  <text x="48" y="668" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">An index: 100 is the median paid by buyers domiciled in Portugal. The release publishes the difference, not the two prices.</text>
  <line x1="48" y1="692" x2="1152" y2="692" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="722" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 7 September 2026</text>
  <text x="1152" y="722" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>