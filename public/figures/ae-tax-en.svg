<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="What an individual actually pays in the Emirates">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">What an individual actually pays in the Emirates</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">NO CHARGING PROVISION EXISTS</text><text x="620" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">AND THESE YOU DO PAY</text><line x1="48" y1="218" x2="1152" y2="218" stroke="#dce0e7" stroke-width="1"/><text x="48" y="262" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">Personal income tax</text><text x="48" y="308" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">Capital gains tax</text><text x="48" y="354" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">Inheritance tax</text><text x="48" y="400" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">Wealth tax</text><text x="48" y="458" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="48" dy="0">Not an exemption, an absence:</tspan><tspan x="48" dy="25">an exemption is withdrawn by amending</tspan><tspan x="48" dy="25">an instrument, an absence by enacting one.</tspan></text><text x="620" y="262" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">VAT</text><text x="620" y="286" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Federal Decree-Law 8/2017, art. 3</text><text x="1152" y="262" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="end">5%</text><text x="620" y="340" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Dubai property transfer fee</text><text x="620" y="364" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Resolution 30/2013, schedule item 1</text><text x="1152" y="340" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="end">4%</text><text x="620" y="418" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Dubai municipality housing fee</text><text x="620" y="442" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#7a2230" text-anchor="start">No instrument could be found</text><text x="1152" y="418" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="end">5%</text><text x="620" y="496" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Corporate tax</text><text x="620" y="520" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Above AED 375,000 — Cabinet Decision 116/2022</text><text x="1152" y="496" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="end">9%</text>
  <text x="48" y="608" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The municipality fee is the one figure here that could not be traced to an instrument.</text>
  <line x1="48" y1="632" x2="1152" y2="632" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="662" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 30 August 2026</text>
  <text x="1152" y="662" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>