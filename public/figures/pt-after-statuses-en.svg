<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Two statuses the market treats as one">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Two statuses the market treats as one</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="400" y="216" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0e1420" text-anchor="start">National permanent</text><text x="810" y="216" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0e1420" text-anchor="start">EU long-term resident</text><line x1="48" y1="238" x2="1152" y2="238" stroke="#dce0e7" stroke-width="1"/><text x="48" y="286" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start">Set by</text><text x="400" y="286" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">Article 80 of Lei 23/2007</text><text x="810" y="286" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">Directive 2003/109/EC</text><line x1="48" y1="312" x2="1152" y2="312" stroke="#dce0e7" stroke-width="1"/><text x="48" y="362" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start">Years required</text><text x="400" y="362" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">Five, as temporary resident</text><text x="810" y="362" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">Five, lawful residence</text><line x1="48" y1="388" x2="1152" y2="388" stroke="#dce0e7" stroke-width="1"/><text x="48" y="438" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start">What it secures</text><text x="400" y="438" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">Your position in Portugal</text><text x="810" y="438" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">Mobility inside the EU</text><line x1="48" y1="464" x2="1152" y2="464" stroke="#dce0e7" stroke-width="1"/><text x="48" y="514" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start">Other member states</text><text x="400" y="514" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">No rights conferred</text><text x="810" y="514" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">Subject to their terms</text>
  <text x="48" y="608" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Article 80 opens by setting the long-term resident regime aside. The statute keeps them parallel; most guides merge them.</text>
  <line x1="48" y1="632" x2="1152" y2="632" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="662" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 4 September 2026</text>
  <text x="1152" y="662" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>