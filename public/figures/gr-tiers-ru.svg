<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Четыре порога золотой визы Греции и их условия">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ГАЙДЫ И ИССЛЕДОВАНИЯ</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Четыре порога золотой визы Греции и их условия</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="1152" y="214" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="end" letter-spacing="2.93">МИНИМАЛЬНАЯ ПЛОЩАДЬ</text><line x1="48" y1="232" x2="1152" y2="232" stroke="#dce0e7" stroke-width="1"/><text x="48" y="280" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="start">800 000 €</text><text x="270" y="280" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Аттика, Салоники, Миконос, Тира</text><text x="270" y="306" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">И острова свыше 3 100 жителей — ст. 100 §2(a)</text><text x="1152" y="280" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#7a2230" text-anchor="end">120 м²</text><line x1="48" y1="342" x2="1152" y2="342" stroke="#dce0e7" stroke-width="1"/><text x="48" y="380" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="start">400 000 €</text><text x="270" y="380" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Остальная территория Греции</text><text x="270" y="406" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Ст. 100 §2(b)</text><text x="1152" y="380" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#7a2230" text-anchor="end">120 м²</text><line x1="48" y1="442" x2="1152" y2="442" stroke="#dce0e7" stroke-width="1"/><text x="48" y="480" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="start">250 000 €</text><text x="270" y="480" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Перевод помещений в жильё</text><text x="270" y="506" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Работы завершены до подачи — ст. 100 §2(c)</text><text x="1152" y="480" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="end">нормы нет</text><line x1="48" y1="542" x2="1152" y2="542" stroke="#dce0e7" stroke-width="1"/><text x="48" y="580" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="start">250 000 €</text><text x="270" y="580" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Реставрация здания-памятника</text><text x="270" y="606" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Продажа до окончания работ ничтожна — ст. 100 §2(d)</text><text x="1152" y="580" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="end">нормы нет</text>
  <text x="48" y="668" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Правило «один объект» действует во всех четырёх случаях. Минимальная площадь — только в §2(a) и §2(b).</text>
  <line x1="48" y1="692" x2="1152" y2="692" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="722" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Все цифры сверены с первоисточником 28 августа 2026 года</text>
  <text x="1152" y="722" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>