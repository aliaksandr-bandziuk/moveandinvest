<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="What sets the golden visa threshold, and what sets nothing">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">What sets the golden visa threshold, and what sets nothing</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="1152" y="214" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="end" letter-spacing="2.93">PUBLISHED</text><line x1="48" y1="232" x2="1152" y2="232" stroke="#dce0e7" stroke-width="1"/><rect x="48" y="262" width="4" height="56" fill="#7a2230"/><text x="76" y="288" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Federal Decree-Law 29/2021</text><text x="76" y="314" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Sets no threshold: delegates to the regulation</text><text x="1152" y="288" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="end">yes</text><line x1="48" y1="336" x2="1152" y2="336" stroke="#dce0e7" stroke-width="1"/><rect x="48" y="362" width="4" height="56" fill="#7a2230"/><text x="76" y="388" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Cabinet Resolution 65/2022, Annex art. 8</text><text x="76" y="414" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">AED 2,000,000, one or more properties</text><text x="1152" y="388" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="end">yes</text><line x1="48" y1="436" x2="1152" y2="436" stroke="#dce0e7" stroke-width="1"/><rect x="48" y="462" width="4" height="56" fill="#7a2230"/><text x="76" y="488" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Executive Council Resolution 30/2013</text><text x="76" y="514" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">4%, shared equally between the parties</text><text x="1152" y="488" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="end">yes</text><line x1="48" y1="536" x2="1152" y2="536" stroke="#dce0e7" stroke-width="1"/><rect x="48" y="562" width="4" height="56" fill="#b9c0cc"/><text x="76" y="588" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#5a6478" text-anchor="start">Dubai, the 2026 changes</text><text x="76" y="614" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The AED 750,000 floor and the 50% upfront rule, both removed</text><text x="1152" y="588" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="end">found in no register</text>
  <text x="48" y="668" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">All 32 Dubai instruments of 2026 were checked, with the memorandum register and DLD's own page.</text>
  <line x1="48" y1="692" x2="1152" y2="692" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="722" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 30 August 2026</text>
  <text x="1152" y="722" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>