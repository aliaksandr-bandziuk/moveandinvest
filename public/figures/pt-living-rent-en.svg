  <text x="48" y="196" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Median rent per square metre in new leases, Q1 2026. Every area shown is above the national median.</text><rect x="210.0" y="250.0" width="135.3" height="350.0" fill="#7a2230"/><text x="277.6666666666667" y="232" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0e1420" text-anchor="middle">17.42 €</text><text x="277.6666666666667" y="634" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">Lisbon, municipality</text><rect x="371.3" y="311.1" width="135.3" height="288.9" fill="#7a2230"/><text x="439.00000000000006" y="293.07921928817456" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0e1420" text-anchor="middle">14.38 €</text><text x="439.00000000000006" y="634" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">Greater Lisbon</text><rect x="532.7" y="359.5" width="135.3" height="240.5" fill="#7a2230"/><text x="600.3333333333334" y="341.5005740528129" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0e1420" text-anchor="middle">11.97 €</text><text x="600.3333333333334" y="634" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">Madeira</text><rect x="694.0" y="372.0" width="135.3" height="228.0" fill="#7a2230"/><text x="761.6666666666666" y="353.95752009184844" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0e1420" text-anchor="middle">11.35 €</text><text x="761.6666666666666" y="634" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">Setúbal Peninsula</text><rect x="855.3" y="384.8" width="135.3" height="215.2" fill="#7a2230"/><text x="923" y="366.816303099885