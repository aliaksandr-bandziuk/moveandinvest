  <text x="48" y="608" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The purchase rows come to 118,250 €; notary and legal fees, which carry no published tariff, take it to about 126,000 €.</text>
