<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Article X(2) has two conditions, not one">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Article X(2) has two conditions, not one</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="260" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="600" fill="#0e1420" text-anchor="start">Is a resident of Greece</text><text x="48" y="290" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">The condition every page prints</text><text x="48" y="342" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="600" fill="#5a6478" text-anchor="start">and</text><text x="48" y="390" font-family="Inter, system-ui, sans-serif" font-size="27" font-weight="600" fill="#7a2230" text-anchor="start">Is subject to Greek tax in respect of that pension</text><text x="48" y="420" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">The condition the article adds, and the one that is left out</text><line x1="48" y1="496" x2="1152" y2="496" stroke="#b9c0cc" stroke-width="1"/><text x="48" y="530" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">Then the UK-source pension is exempt from United Kingdom tax</text>
  <text x="48" y="608" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Residence in Greece alone does not exempt a UK pension from UK tax.</text>
  <line x1="48" y1="632" x2="1152" y2="632" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="662" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 9 September 2026</text>
  <text x="1152" y="662" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>