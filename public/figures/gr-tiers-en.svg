<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="The four Greek golden visa thresholds and what attaches to each">
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">The four Greek golden visa thresholds and what attaches to each</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="1152" y="214" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="end" letter-spacing="2.93">MINIMUM FLOOR AREA</text><line x1="48" y1="232" x2="1152" y2="232" stroke="#dce0e7" stroke-width="1"/><text x="48" y="280" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="start">€800,000</text><text x="270" y="280" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Attica, Thessaloniki, Mykonos, Thira</text><text x="270" y="306" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">And islands above 3,100 inhabitants — art. 100 §2(a)</text><text x="1152" y="280" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#7a2230" text-anchor="end">120 m²</text><line x1="48" y1="342" x2="1152" y2="342" stroke="#dce0e7" stroke-width="1"/><text x="48" y="380" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="start">€400,000</text><text x="270" y="380" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">The rest of the country</text><text x="270" y="406" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Art. 100 §2(b)</text><text x="1152" y="380" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#7a2230" text-anchor="end">120 m²</text><line x1="48" y1="442" x2="1152" y2="442" stroke="#dce0e7" stroke-width="1"/><text x="48" y="480" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="start">€250,000</text><text x="270" y="480" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Change of use to residential</text><text x="270" y="506" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Works finished before filing — art. 100 §2(c)</text><text x="1152" y="480" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="end">none stated</text><line x1="48" y1="542" x2="1152" y2="542" stroke="#dce0e7" stroke-width="1"/><text x="48" y="580" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="start">€250,000</text><text x="270" y="580" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Restoration of a listed building</text><text x="270" y="606" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">A sale before the works are done is void — art. 100 §2(d)</text><text x="1152" y="580" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#5a6478" text-anchor="end">none stated</text>
  <text x="48" y="668" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The single-property rule applies to all four. The minimum floor area appears in §2(a) and §2(b) only.</text>
  <line x1="48" y1="692" x2="1152" y2="692" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="722" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 28 August 2026</text>
  <text x="1152" y="722" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>