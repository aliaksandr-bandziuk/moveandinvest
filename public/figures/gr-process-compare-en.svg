<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" role="img" aria-label="Three Greek routes the market keeps fusing">
  <rect width="1200" height="920" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Three Greek routes the market keeps fusing</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="330" y="216" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="start">Art. 100 — property</text><text x="620" y="216" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="start">Art. 100A — startup</text><text x="910" y="216" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#0e1420" text-anchor="start">Art. 79A — Tech Visa</text><line x1="48" y1="240" x2="1152" y2="240" stroke="#dce0e7" stroke-width="1"/><text x="48" y="292" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start">What it is granted for</text><text x="330" y="292" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="330" dy="0">An investment completed</tspan><tspan x="330" dy="25">before filing</tspan></text><text x="620" y="292" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="620" dy="0">Capital paid into a</tspan><tspan x="620" dy="25">registered startup</tspan></text><text x="910" y="292" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="910" dy="0">A twelve-month contract</tspan><tspan x="910" dy="25">at a registered startup</tspan></text><line x1="48" y1="332" x2="1152" y2="332" stroke="#dce0e7" stroke-width="1"/><text x="48" y="376" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start">The threshold</text><text x="330" y="376" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="330" dy="0">800,000 / 400,000 /</tspan><tspan x="330" dy="25">250,000 € by zone</tspan></text><text x="620" y="376" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="620" dy="0">250,000 €, up to 33 %</tspan><tspan x="620" dy="25">of the company</tspan></text><text x="910" y="376" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="910" dy="0">Salary at 1.6× the</tspan><tspan x="910" dy="25">average gross wage</tspan></text><line x1="48" y1="416" x2="1152" y2="416" stroke="#dce0e7" stroke-width="1"/><text x="48" y="460" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start">Right to work in Greece</text><text x="330" y="460" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">None at all — §9</text><text x="620" y="460" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">None at all — §9</text><text x="910" y="460" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="910" dy="0">Immediate, that one</tspan><tspan x="910" dy="25">employer only</tspan></text><line x1="48" y1="500" x2="1152" y2="500" stroke="#dce0e7" stroke-width="1"/><text x="48" y="544" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start">How long it runs</text><text x="330" y="544" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Five years, renewable</text><text x="620" y="544" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="620" dy="0">One year, then two</tspan><tspan x="620" dy="25">at a time</tspan></text><text x="910" y="544" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Twelve months</text><line x1="48" y1="584" x2="1152" y2="584" stroke="#dce0e7" stroke-width="1"/><text x="48" y="628" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start">What ends it</text><text x="330" y="628" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Absence does not — §4</text><text x="620" y="628" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="620" dy="0">Losing the two jobs or</tspan><tspan x="620" dy="25">the shares — §2, §10</tspan></text><text x="910" y="628" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="910" dy="0">The job ending, with</tspan><tspan x="910" dy="25">immediate departure</tspan></text><line x1="48" y1="668" x2="1152" y2="668" stroke="#dce0e7" stroke-width="1"/><text x="48" y="712" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#0e1420" text-anchor="start">Where it leads</text><text x="330" y="712" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="330" dy="0">Permanent residence,</tspan><tspan x="330" dy="25">then citizenship</tspan></text><text x="620" y="712" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="620" dy="0">Renewal while the</tspan><tspan x="620" dy="25">investment is held</tspan></text><text x="910" y="712" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="910" dy="0">EU Blue Card, same</tspan><tspan x="910" dy="25">employer only</tspan></text>
  <text x="48" y="828" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Article 100A was added in December 2024 and article 79A in February 2026. Neither touched article 100.</text>
  <line x1="48" y1="852" x2="1152" y2="852" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="882" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 5 September 2026</text>
  <text x="1152" y="882" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>