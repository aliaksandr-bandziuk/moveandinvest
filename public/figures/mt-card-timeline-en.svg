<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 780" width="1240" height="780" role="img" aria-label="Two months you cannot leave, and a six-week window">
  <rect width="1240" height="780" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Two months you cannot leave, and a six-week window</text>
  <line x1="48" y1="144" x2="1192" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="306" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0e1420" text-anchor="start">First application</text><line x1="260" y1="300" x2="1152" y2="300" stroke="#b9c0cc" stroke-width="1"/><rect x="300" y="278" width="480" height="44" rx="4" fill="#7a2230"/><text x="540" y="306" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" fill="#ffffff" text-anchor="middle">8-10 weeks. Interim receipt: no travel, no re-entry</text><line x1="300" y1="270" x2="300" y2="330" stroke="#0e1420" stroke-width="1.5"/><text x="300" y="358" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">Submission</text><line x1="780" y1="270" x2="780" y2="330" stroke="#0e1420" stroke-width="1.5"/><text x="780" y="358" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">Approval</text><line x1="920" y1="270" x2="920" y2="330" stroke="#0e1420" stroke-width="1.5"/><text x="920" y="358" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle"><tspan x="920" dy="0">Notice with PIN,</tspan><tspan x="920" dy="25">by post</tspan></text><line x1="1152" y1="270" x2="1152" y2="330" stroke="#0e1420" stroke-width="1.5"/><text x="1152" y="358" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="end"><tspan x="1152" dy="0">Collect in person,</tspan><tspan x="1152" dy="25">Msida</tspan></text><text x="48" y="526" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0e1420" text-anchor="start">Renewal</text><line x1="260" y1="520" x2="1152" y2="520" stroke="#b9c0cc" stroke-width="1"/><rect x="700" y="498" width="300" height="44" rx="4" fill="none" stroke="#7a2230" stroke-width="1.5"/><text x="850" y="526" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="500" fill="#0e1420" text-anchor="middle">The only window</text><text x="700" y="578" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">3 months before</text><text x="1000" y="578" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="middle">6 weeks before</text><line x1="1152" y1="490" x2="1152" y2="550" stroke="#0e1420" stroke-width="2.5"/><text x="1152" y="476" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="end">Permit expires</text><text x="260" y="626" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Travel is generally possible on a valid passport and the existing card</text>
  <text x="48" y="688" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The receipt says on its face that it is not a travel document. The renewal window opens three months out and closes six weeks out.</text>
  <line x1="48" y1="712" x2="1192" y2="712" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="742" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 5 September 2026</text>
  <text x="1192" y="742" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>