<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1150" width="1200" height="1150" role="img" aria-label="A cross-reference to a procedure that was repealed">
  <rect width="1200" height="1150" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">A cross-reference to a procedure that was repealed</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">WHEN</text><text x="330" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">WHAT HAPPENED</text><line x1="48" y1="218" x2="1152" y2="218" stroke="#dce0e7" stroke-width="1"/><text x="48" y="272" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">30 Sep 2022</text><text x="330" y="272" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">The cross-reference is written</text><text x="330" y="300" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">DR 4/2022 inserts art. 31-A. Its n.º 2 sends an applicant without the visa to arts. 88 and 89.</text><line x1="48" y1="350" x2="1152" y2="350" stroke="#dce0e7" stroke-width="1"/><text x="48" y="404" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">17 Jan 2024</text><text x="330" y="404" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">The regulation is amended for the last time</text><text x="330" y="432" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">DR 1/2024, the seventh amendment to DR 84/2007. It does not touch art. 31-A.</text><line x1="48" y1="482" x2="1152" y2="482" stroke="#dce0e7" stroke-width="1"/><text x="48" y="536" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">4 Jun 2024</text><text x="330" y="536" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">The procedure is repealed</text><text x="330" y="564" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">DL 37-A/2024, art. 2: arts. 88(2), 88(6), 89(2), 89(4) and 89(5) of Lei 23/2007.</text><line x1="48" y1="614" x2="1152" y2="614" stroke="#dce0e7" stroke-width="1"/><text x="48" y="668" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">8 Nov 2024</text><text x="330" y="668" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">The transitional rule is widened, not the route</text><text x="330" y="696" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Lei 40/2024 protects proceedings already begun and people already contributing.</text><line x1="48" y1="746" x2="1152" y2="746" stroke="#dce0e7" stroke-width="1"/><text x="48" y="800" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">23 Oct 2025</text><text x="330" y="800" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">The paragraph is refilled with something else</text><text x="330" y="828" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Lei 61/2025 gives art. 89 a new n.º 4, about certified business incubators.</text><line x1="48" y1="878" x2="1152" y2="878" stroke="#dce0e7" stroke-width="1"/><text x="48" y="932" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#7a2230" text-anchor="start">Today</text><text x="330" y="932" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#7a2230" text-anchor="start">The cross-reference still stands</text><text x="330" y="960" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Two years and three months of a regulation naming a procedure that does not exist.</text>
  <text x="48" y="1058" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">The regulation has not been amended since January 2024. The paragraphs it names were repealed in June 2024.</text>
  <line x1="48" y1="1082" x2="1152" y2="1082" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="1112" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 7 September 2026</text>
  <text x="1152" y="1112" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>