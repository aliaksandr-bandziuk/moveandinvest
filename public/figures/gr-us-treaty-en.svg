<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="A treaty signed in 1950, amended once">
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">A treaty signed in 1950, amended once</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">SIGNED</text><text x="330" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GREEK RESIDENCE CHANGES</text><line x1="48" y1="218" x2="1152" y2="218" stroke="#dce0e7" stroke-width="1"/><text x="48" y="272" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">20 February 1950</text><text x="330" y="272" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Signed</text><text x="330" y="300" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Convention for the avoidance of double taxation on income</text><line x1="48" y1="350" x2="1152" y2="350" stroke="#dce0e7" stroke-width="1"/><text x="48" y="404" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">20 April 1953</text><text x="330" y="404" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Protocol</text><text x="330" y="432" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Mutual assistance in collecting taxes, and nothing else</text><line x1="48" y1="482" x2="1152" y2="482" stroke="#dce0e7" stroke-width="1"/><text x="48" y="536" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#0e1420" text-anchor="start">1 January 1953</text><text x="330" y="536" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">In force</text><text x="330" y="564" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Operative from this date; instruments exchanged that December</text><line x1="48" y1="614" x2="1152" y2="614" stroke="#dce0e7" stroke-width="1"/><text x="48" y="668" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="600" fill="#7a2230" text-anchor="start">no further amendment</text><text x="330" y="668" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#7a2230" text-anchor="start">Since then</text><text x="330" y="696" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Seventy-six years, through every change in treaty practice</text>
  <text x="48" y="808" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Article XIV(1) is the saving clause: each country may tax its own citizens as though the convention had not been made.</text>
  <line x1="48" y1="832" x2="1152" y2="832" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="862" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 8 September 2026</text>
  <text x="1152" y="862" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>