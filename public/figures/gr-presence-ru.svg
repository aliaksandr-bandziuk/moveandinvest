<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 664" width="1200" height="664" role="img" aria-label="Почему годы идут в зачёт одному и не идут другому">
  <rect width="1200" height="664" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ГАЙДЫ И ИССЛЕДОВАНИЯ</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Почему годы идут в зачёт одному и не идут другому</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="200" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Инвестор, который живёт в Греции</text><text x="48" y="226" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Отлучки в пределах ст. 144 §3</text><rect x="48" y="250" width="120" height="60" fill="#7a2230"/><text x="108" y="288" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#ffffff" text-anchor="middle">1</text><rect x="180" y="250" width="120" height="60" fill="#7a2230"/><text x="240" y="288" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#ffffff" text-anchor="middle">2</text><rect x="312" y="250" width="120" height="60" fill="#7a2230"/><text x="372" y="288" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#ffffff" text-anchor="middle">3</text><rect x="444" y="250" width="120" height="60" fill="#7a2230"/><text x="504" y="288" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#ffffff" text-anchor="middle">4</text><rect x="576" y="250" width="120" height="60" fill="#7a2230"/><text x="636" y="288" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#ffffff" text-anchor="middle">5</text><text x="730" y="272" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#7a2230" text-anchor="start">Пять зачётных лет</text><text x="730" y="298" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Открыт статус долгосрочного резидента</text><text x="48" y="396" font-family="Inter, system-ui, sans-serif" font-size="23" font-weight="500" fill="#0e1420" text-anchor="start">Инвестор, который приезжает изредка</text><text x="48" y="422" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Ст. 100 §4: отлучки не мешают продлению</text><rect x="48" y="446" width="120" height="60" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><text x="108" y="484" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#5a6478" text-anchor="middle">1</text><rect x="180" y="446" width="120" height="60" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><text x="240" y="484" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#5a6478" text-anchor="middle">2</text><rect x="312" y="446" width="120" height="60" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><text x="372" y="484" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#5a6478" text-anchor="middle">3</text><rect x="444" y="446" width="120" height="60" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><text x="504" y="484" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#5a6478" text-anchor="middle">4</text><rect x="576" y="446" width="120" height="60" fill="#ffffff" stroke="#b9c0cc" stroke-width="1" stroke-dasharray="4 4"/><text x="636" y="484" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="21" font-weight="400" fill="#5a6478" text-anchor="middle">5</text><text x="730" y="468" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#5a6478" text-anchor="start">Ни одного зачётного года</text><text x="730" y="494" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Виза продлевается бесконечно</text>
  <text x="48" y="572" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Ст. 144 §1 требует фактического проживания: отлучки не больше шести месяцев подряд и не больше десяти месяцев за пять лет.</text>
  <line x1="48" y1="596" x2="1152" y2="596" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="626" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Все цифры сверены с первоисточником 28 августа 2026 года</text>
  <text x="1152" y="626" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>