<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Что в ОАЭ действительно платит физическое лицо">
  <rect width="1200" height="700" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">ГАЙДЫ И ИССЛЕДОВАНИЯ</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Что в ОАЭ действительно платит физическое лицо</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">НОРМЫ, УСТАНАВЛИВАЮЩЕЙ НАЛОГ, НЕТ</text><text x="620" y="200" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">А ЭТО ПЛАТИТЬ ПРИДЁТСЯ</text><line x1="48" y1="218" x2="1152" y2="218" stroke="#dce0e7" stroke-width="1"/><text x="48" y="262" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">Подоходный налог</text><text x="48" y="308" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">Налог на прирост капитала</text><text x="48" y="354" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">Налог на наследство</text><text x="48" y="400" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="400" fill="#5a6478" text-anchor="start">Налог на богатство</text><text x="48" y="458" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start"><tspan x="48" dy="0">Не освобождение, а отсутствие нормы:</tspan><tspan x="48" dy="25">освобождение отменяют поправкой,</tspan><tspan x="48" dy="25">отсутствие — принятием закона.</tspan></text><text x="620" y="262" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">НДС</text><text x="620" y="286" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Декрет-закон 8/2017, ст. 3</text><text x="1152" y="262" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="end">5%</text><text x="620" y="340" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Сбор за переход права, Дубай</text><text x="620" y="364" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Резолюция 30/2013, приложение, п. 1</text><text x="1152" y="340" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="end">4%</text><text x="620" y="418" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Сбор муниципалитета Дубая</text><text x="620" y="442" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#7a2230" text-anchor="start">Акт установить не удалось</text><text x="1152" y="418" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="end">5%</text><text x="620" y="496" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Корпоративный налог</text><text x="620" y="520" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Свыше 375 000 дирхамов — решение 116/2022</text><text x="1152" y="496" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" font-weight="600" fill="#0e1420" text-anchor="end">9%</text>
  <text x="48" y="608" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Сбор муниципалитета — единственная цифра, которую не удалось привязать к акту.</text>
  <line x1="48" y1="632" x2="1152" y2="632" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="662" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Все цифры сверены с первоисточником 30 августа 2026 года</text>
  <text x="1152" y="662" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>