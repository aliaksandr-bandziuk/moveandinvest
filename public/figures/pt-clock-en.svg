<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Years of residence required before Portuguese citizenship">
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">Years of residence required before Portuguese citizenship</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="250" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Filed up to 18 May 2026</text><text x="48" y="276" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Decided under the previous version of the law</text><path d="M620 236 h196 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-196 z" fill="#7a2230" opacity="0.70"/><text x="834" y="255" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">5 years</text><text x="48" y="334" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">EU and Portuguese-speaking country nationals</text><text x="48" y="360" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Art. 6(1)(b), Lei Orgânica 1/2026</text><path d="M620 320 h276 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-276 z" fill="#7a2230" opacity="0.82"/><text x="914" y="339" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">7 years</text><text x="48" y="418" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="500" fill="#0e1420" text-anchor="start">Everyone else</text><text x="48" y="444" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Art. 6(1)(b), Lei Orgânica 1/2026</text><path d="M620 404 h396 a4 4 0 0 1 4 4 v20 a4 4 0 0 1 -4 4 h-396 z" fill="#7a2230" opacity="1.00"/><text x="1034" y="423" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="400" fill="#0e1420" text-anchor="start">10 years</text>
  <text x="48" y="528" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Lei Orgânica 1/2026 is in force from 19 May 2026. Proceedings filed up to and including 18 May are decided under the previous version.</text>
  <line x1="48" y1="552" x2="1152" y2="552" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="582" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 28 August 2026</text>
  <text x="1152" y="582" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>