<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="How long each passport actually takes">
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="48" y="62" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="500" fill="#5a6478" text-anchor="start" letter-spacing="2.93">GUIDES &amp; RESEARCH</text>
  <text x="48" y="112" font-family="Inter, system-ui, sans-serif" font-size="35" font-weight="600" fill="#0e1420" text-anchor="start">How long each passport actually takes</text>
  <line x1="48" y1="144" x2="1152" y2="144" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="190" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Years of residence before naturalisation</text><line x1="300.0" y1="228" x2="300.0" y2="560" stroke="#dce0e7" stroke-width="1"/><text x="300" y="590" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="middle">0</text><line x1="438.0" y1="228" x2="438.0" y2="560" stroke="#dce0e7" stroke-width="1"/><text x="438" y="590" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="middle">2</text><line x1="576.0" y1="228" x2="576.0" y2="560" stroke="#dce0e7" stroke-width="1"/><text x="576" y="590" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="middle">4</text><line x1="714.0" y1="228" x2="714.0" y2="560" stroke="#dce0e7" stroke-width="1"/><text x="714" y="590" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="middle">6</text><line x1="852.0" y1="228" x2="852.0" y2="560" stroke="#dce0e7" stroke-width="1"/><text x="852" y="590" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="middle">8</text><line x1="990.0" y1="228" x2="990.0" y2="560" stroke="#dce0e7" stroke-width="1"/><text x="990" y="590" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="middle">10</text><text x="48" y="274" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0e1420" text-anchor="start">Portugal</text><rect x="300" y="252" width="690.0" height="32" fill="#7a2230"/><text x="1004" y="274" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="600" fill="#0e1420" text-anchor="start">10 years</text><line x1="783.0" y1="242" x2="783.0" y2="294" stroke="#ffffff" stroke-width="2"/><text x="783" y="230" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="middle">7 for EU and CPLP citizens</text><text x="48" y="348" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0e1420" text-anchor="start">Greece</text><rect x="300" y="326" width="483.0" height="32" fill="#7a2230"/><text x="797" y="348" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="600" fill="#0e1420" text-anchor="start">7 years</text><text x="48" y="422" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0e1420" text-anchor="start">Malta</text><rect x="300" y="400" width="345.0" height="32" fill="#7a2230"/><rect x="645.0" y="400" width="138.0" height="32" fill="none" stroke="#7a2230" stroke-width="1.5" stroke-dasharray="5 4"/><text x="797" y="422" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="600" fill="#0e1420" text-anchor="start">5–7 years</text><text x="48" y="496" font-family="Inter, system-ui, sans-serif" font-size="21" font-weight="600" fill="#0e1420" text-anchor="start">UAE</text><text x="300" y="496" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5a6478" text-anchor="start">Nationality is granted on nomination. There is no application.</text>
  <text x="48" y="628" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="400" fill="#5a6478" text-anchor="start">Malta is a range because its statute is one: twelve continuous months plus four years inside the six before them.</text>
  <line x1="48" y1="652" x2="1152" y2="652" stroke="#dce0e7" stroke-width="1"/>
  <text x="48" y="682" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="400" fill="#5a6478" text-anchor="start">Every figure checked against a primary source on 5 September 2026</text>
  <text x="1152" y="682" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" font-weight="400" fill="#5a6478" text-anchor="end">moveandinvest.com</text>
</svg>